apiVersion: batch/v1
kind: CronJob
metadata: { name: sqlite-backup }
spec:
  schedule: "30 2 * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata: { labels: { app: build-portal, component: backup, architecture: sqlite } }
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          nodeSelector: { kubernetes.io/hostname: pve-nas }
          securityContext: { seccompProfile: { type: RuntimeDefault }, fsGroup: 10001 }
          containers:
            - name: sqlite-backup
              image: SET_IMAGE
              command: [node, /app/dist/backup.mjs]
              envFrom: [{ secretRef: { name: build-portal-runtime-sqlite } }]
              env: [{ name: SQLITE_BACKUP_DIR, value: /var/lib/zhanlu-build/backups }, { name: SQLITE_BACKUP_RETENTION_DAYS, value: "14" }]
              securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              volumeMounts: [{ name: state, mountPath: /var/lib/zhanlu-build/state }, { name: backups, mountPath: /var/lib/zhanlu-build/backups }, { name: tmp, mountPath: /tmp }]
          volumes:
            - { name: state, hostPath: { path: /vol1/1000/k8s-build/build-portal/state, type: Directory } }
            - { name: backups, hostPath: { path: /vol1/1000/k8s-build/build-portal/backups, type: Directory } }
            - { name: tmp, emptyDir: {} }
