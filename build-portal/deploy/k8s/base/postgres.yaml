apiVersion: v1
kind: Service
metadata: { name: postgres }
spec: { selector: { app: postgres }, ports: [{ name: postgres, port: 5432, targetPort: 5432 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres, component: database } }
    spec:
      automountServiceAccountToken: false
      nodeSelector: { kubernetes.io/arch: amd64 }
      affinity: { nodeAffinity: { preferredDuringSchedulingIgnoredDuringExecution: [{ weight: 100, preference: { matchExpressions: [{ key: kubernetes.io/hostname, operator: In, values: [peng-pve-ubuntu] }] } }] } }
      tolerations: [{ key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }]
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: postgres:16.10-bookworm
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: zhanlu_build }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: build-portal-db, key: username } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: build-portal-db, key: password } } }
          readinessProbe: { exec: { command: [sh, -c, 'pg_isready -U "$POSTGRES_USER"'] }, periodSeconds: 5, timeoutSeconds: 3 }
          # The NAS export is root-squashed and provisions this directory as
          # uid/gid 1000:1001. Run PostgreSQL with that owner so no chown is
          # required at startup and the container remains non-root.
          securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1001, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "2", memory: 2Gi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: postgres-data } }]
