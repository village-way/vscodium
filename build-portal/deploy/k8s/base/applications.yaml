apiVersion: v1
kind: Service
metadata: { name: build-portal }
spec:
  type: NodePort
  selector: { app: build-portal, component: web, architecture: sqlite }
  ports: [{ name: https, port: 8443, targetPort: 8443, nodePort: 30443 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: build-portal }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: build-portal, component: web, architecture: sqlite } }
  template:
    metadata: { labels: { app: build-portal, component: web, architecture: sqlite } }
    spec:
      automountServiceAccountToken: false
      nodeSelector: { kubernetes.io/hostname: pve-nas }
      hostAliases: [{ ip: 10.155.208.112, hostnames: [gitlab.cmss.com] }]
      securityContext: { seccompProfile: { type: RuntimeDefault }, fsGroup: 10001 }
      initContainers:
        - name: prepare-storage
          image: SET_IMAGE
          command: [/bin/sh, -ceu, "install -d -o 10001 -g 10001 -m 0750 /storage/state /storage/git-cache /storage/backups"]
          securityContext: { runAsUser: 0, runAsGroup: 0, allowPrivilegeEscalation: false, capabilities: { drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER] } }
          volumeMounts: [{ name: state, mountPath: /storage/state }, { name: git-cache, mountPath: /storage/git-cache }, { name: backups, mountPath: /storage/backups }]
      containers:
        - name: web
          image: SET_IMAGE
          command: [node, /app/apps/web/server.js]
          ports: [{ name: http, containerPort: 3000 }]
          envFrom: [{ secretRef: { name: build-portal-runtime-sqlite } }]
          env: [{ name: APP_COMPONENT, value: web }, { name: HOSTNAME, value: 0.0.0.0 }]
          readinessProbe: { httpGet: { path: /api/health/ready, port: http }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /api/health/live, port: http }, periodSeconds: 15 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
          securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: state, mountPath: /var/lib/zhanlu-build/state }, { name: tmp, mountPath: /tmp }]
        - name: worker
          image: SET_IMAGE
          command: [node, /app/dist/worker.mjs]
          envFrom: [{ secretRef: { name: build-portal-runtime-sqlite } }, { secretRef: { name: build-portal-worker-v2 } }]
          env:
            - { name: APP_COMPONENT, value: worker }
            - { name: WORKSPACE_ROOT, value: /var/lib/zhanlu-build/work }
            - { name: GIT_CACHE_ROOT, value: /var/lib/zhanlu-build/git-cache }
            - { name: ZHANLU_SYNC_VOLUME_ROOT, value: /var/lib/zhanlu-build/git-cache }
            - { name: ZHANLU_SYNC_EXTERNAL_STATE_ROOT, value: /var/lib/zhanlu-build/git-cache }
            - { name: ZHANLU_SYNC_EXTERNAL_TMP_ROOT, value: /var/lib/zhanlu-build/work/sync-tmp }
            - { name: ZHANLU_SYNC_EXTERNAL_CACHE_ROOT, value: /var/lib/zhanlu-build/git-cache }
            - { name: ZHANLU_SYNC_LOCK_ROOT, value: /var/lib/zhanlu-build/work/sync-lock }
            - { name: ZHANLU_SYNC_SKIP_MOUNT_CHECK, value: "1" }
            - { name: RELEASE_GIT_USER_NAME, value: village-way }
            - { name: RELEASE_GIT_USER_EMAIL, value: wandepen@163.com }
            - { name: GIT_CONFIG_COUNT, value: "3" }
            - { name: GIT_CONFIG_KEY_0, value: credential.https://github.com.helper }
            - { name: GIT_CONFIG_VALUE_0, value: "!node /app/dist/credential-helper.mjs" }
            - { name: GIT_CONFIG_KEY_1, value: credential.http://gitlab.cmss.com.helper }
            - { name: GIT_CONFIG_VALUE_1, value: "!/usr/local/bin/zhanlu-gitlab-credential" }
            - { name: GIT_CONFIG_KEY_2, value: safe.directory }
            - { name: GIT_CONFIG_VALUE_2, value: "*" }
          resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } }
          securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: state, mountPath: /var/lib/zhanlu-build/state }, { name: git-cache, mountPath: /var/lib/zhanlu-build/git-cache }, { name: work, mountPath: /var/lib/zhanlu-build/work }, { name: github-key, mountPath: /run/secrets/github, readOnly: true }, { name: credentials, mountPath: /run/zhanlu-credentials }, { name: tmp, mountPath: /tmp }]
        - name: caddy
          image: caddy:2.10.2-alpine
          command: [/bin/sh, -ceu]
          args: ["cp /usr/bin/caddy /tmp/caddy && exec /tmp/caddy run --config /etc/caddy/Caddyfile"]
          ports: [{ name: https, containerPort: 8443 }]
          readinessProbe: { tcpSocket: { port: https }, periodSeconds: 5 }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { cpu: 250m, memory: 128Mi } }
          securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }, { name: caddy-config, mountPath: /etc/caddy, readOnly: true }, { name: tls, mountPath: /etc/zhanlu-tls, readOnly: true }, { name: caddy-data, mountPath: /data }, { name: caddy-runtime, mountPath: /config }]
      volumes:
        - { name: state, hostPath: { path: /vol1/1000/k8s-build/build-portal/state, type: DirectoryOrCreate } }
        - { name: git-cache, hostPath: { path: /vol1/1000/k8s-build/build-portal/git-cache, type: DirectoryOrCreate } }
        - { name: backups, hostPath: { path: /vol1/1000/k8s-build/build-portal/backups, type: DirectoryOrCreate } }
        - { name: work, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - { name: credentials, emptyDir: {} }
        - { name: github-key, secret: { secretName: build-portal-github-app, defaultMode: 256 } }
        - { name: caddy-config, configMap: { name: build-portal-caddy } }
        - { name: tls, secret: { secretName: build-portal-tls } }
        - { name: caddy-data, emptyDir: {} }
        - { name: caddy-runtime, emptyDir: {} }
