apiVersion: v1
kind: Service
metadata: { name: build-portal }
spec:
  type: NodePort
  selector: { app: build-portal, component: web }
  ports: [{ name: https, port: 8443, targetPort: 8443, nodePort: 30443 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: build-portal-web }
spec:
  replicas: 2
  selector: { matchLabels: { app: build-portal, component: web } }
  template:
    metadata: { labels: { app: build-portal, component: web } }
    spec:
      automountServiceAccountToken: false
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: zhanlu/build-portal-web
          ports: [{ name: http, containerPort: 3000 }]
          envFrom: [{ secretRef: { name: build-portal-runtime } }]
          env: [{ name: APP_COMPONENT, value: web }, { name: HOSTNAME, value: 0.0.0.0 }]
          readinessProbe: { httpGet: { path: /api/health/ready, port: http }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /api/health/live, port: http }, periodSeconds: 15 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
          securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
        - name: caddy
          image: caddy:2.10.2-alpine
          command: [/bin/sh, -ceu]
          args: ["cp /usr/bin/caddy /tmp/caddy && exec /tmp/caddy run --config /etc/caddy/Caddyfile"]
          ports: [{ name: https, containerPort: 8443 }]
          readinessProbe: { tcpSocket: { port: https }, periodSeconds: 5 }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { cpu: 250m, memory: 128Mi } }
          securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }, { name: caddy-config, mountPath: /etc/caddy, readOnly: true }, { name: tls, mountPath: /etc/zhanlu-tls, readOnly: true }, { name: caddy-data, mountPath: /data }, { name: caddy-runtime, mountPath: /config }]
      volumes: [{ name: tmp, emptyDir: {} }, { name: caddy-config, configMap: { name: build-portal-caddy } }, { name: tls, secret: { secretName: build-portal-tls } }, { name: caddy-data, emptyDir: {} }, { name: caddy-runtime, emptyDir: {} }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: build-portal-scheduler }
spec:
  replicas: 1
  selector: { matchLabels: { app: build-portal, component: scheduler } }
  template:
    metadata: { labels: { app: build-portal, component: scheduler } }
    spec:
      automountServiceAccountToken: false
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: scheduler
          image: zhanlu/build-portal-web
          command: [node, /scheduler/dist/index.js]
          envFrom: [{ secretRef: { name: build-portal-runtime } }]
          env: [{ name: APP_COMPONENT, value: scheduler }]
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: 250m, memory: 256Mi } }
          securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: build-portal-worker }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: build-portal, component: worker } }
  template:
    metadata: { labels: { app: build-portal, component: worker } }
    spec:
      automountServiceAccountToken: false
      securityContext: { seccompProfile: { type: RuntimeDefault }, fsGroup: 10001 }
      hostAliases: [{ ip: 10.155.208.112, hostnames: [gitlab.cmss.com] }]
      nodeSelector: { kubernetes.io/arch: amd64 }
      affinity: { nodeAffinity: { preferredDuringSchedulingIgnoredDuringExecution: [{ weight: 100, preference: { matchExpressions: [{ key: kubernetes.io/hostname, operator: In, values: [peng-pve-ubuntu] }] } }] } }
      tolerations: [{ key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }]
      containers:
        - name: worker
          image: zhanlu/build-portal-worker
          envFrom: [{ secretRef: { name: build-portal-runtime } }, { secretRef: { name: build-portal-worker } }]
          env:
            - { name: APP_COMPONENT, value: worker }
            - { name: WORKSPACE_ROOT, value: /var/lib/zhanlu-build/workspace }
            # The dedicated NAS export maps all files to its service uid;
            # this isolated workspace is explicitly trusted by Git.
            - { name: GIT_CONFIG_COUNT, value: "3" }
            - { name: GIT_CONFIG_KEY_2, value: safe.directory }
            - { name: GIT_CONFIG_VALUE_2, value: "*" }
          resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } }
          securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: worker-data, mountPath: /var/lib/zhanlu-build }, { name: github-key, mountPath: /run/secrets/github, readOnly: true }, { name: credentials, mountPath: /run/zhanlu-credentials }]
      volumes: [{ name: worker-data, persistentVolumeClaim: { claimName: worker-data } }, { name: github-key, secret: { secretName: build-portal-github-app, defaultMode: 256 } }, { name: credentials, emptyDir: {} }]
