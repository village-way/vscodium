apiVersion: batch/v1
kind: Job
metadata: { name: build-portal-migrate }
spec:
  backoffLimit: 3
  template:
    metadata: { labels: { app: build-portal, component: migration } }
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: 192.168.22.100:30002/zhanlu/build-portal-web:SET_GIT_SHA
          command: [node, /tools/db/dist/migrate.js]
          env: [{ name: DATABASE_URL, valueFrom: { secretKeyRef: { name: build-portal-db, key: url } } }]
          securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
