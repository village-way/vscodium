name: insider-linux

on:
  workflow_dispatch:
    inputs:
      force_version:
        type: boolean
        description: Force update version
      generate_assets:
        type: boolean
        description: Generate assets
      checkout_pr:
        type: string
        description: Checkout PR
      zhanlu_core_ref:
        type: string
        description: Branch or commit of zhanlu-core to fetch (optional)
      # zhanlu_change start - optionally test the same Codex bundle path in Insider builds
      bundle_codex_runtime:
        type: choice
        description: Bundle the optional Codex CLI runtime
        default: '0'
        options: ['0', '1']
      # zhanlu_change end
  repository_dispatch:
    types: [insider]
  push:
    branches: [ insider ]
    paths-ignore:
    - '**/*.md'
    - 'upstream/*.json'
  pull_request:
    branches: [ insider ]
    paths-ignore:
    - '**/*.md'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  APP_NAME: Zhanlu # zhanlu_change - Insider keeps Zhanlu branding
  APP_IDENTIFIER: Ecloud.Zhanlu # zhanlu_change - prepare_vscode derives Ecloud.Zhanlu.Insiders
  ASSETS_REPOSITORY: ${{ github.repository }}-insiders
  BINARY_NAME: zhanlu-insiders # zhanlu_change - Insider asset/package names use the final binary name
  DISABLE_UPDATE: 'yes'
  GH_REPO_PATH: ${{ github.repository }}
  GITHUB_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }} # zhanlu_change - wrapper checkout follows the triggering ref
  ORG_NAME: Ecloud # zhanlu_change - app ids must not depend on GitHub owner
  OS_NAME: linux
  VERSIONS_REPOSITORY: ${{ github.repository_owner }}/versions
  VSCODE_QUALITY: insider
  ZHANLU_CODE_SOURCE_BRANCH: develop # zhanlu_change - wrapper workflow fetches zhanlu-code before source-owned scripts
  ZHANLU_CORE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.zhanlu_core_ref || github.event.client_payload.zhanlu_core_ref || '' }} # zhanlu_change
  # zhanlu_change start - keep optional runtime inputs consistent across Insider jobs
  ZHANLU_BUNDLE_CODEX_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bundle_codex_runtime || github.event.client_payload.bundle_codex_runtime || '0' }}
  # zhanlu_change end

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      MS_COMMIT: ${{ env.MS_COMMIT }}
      MS_TAG: ${{ env.MS_TAG }}
      RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
      SHOULD_BUILD: ${{ env.SHOULD_BUILD }}
      SHOULD_BUILD_SNAP: ${{ env.SHOULD_BUILD_SNAP }} # zhanlu_change - expose the snap gate to the downstream job
      SHOULD_DEPLOY: ${{ env.SHOULD_DEPLOY }}
      ZHANLU_BUNDLE_CODEX_RUNTIME: ${{ env.ZHANLU_BUNDLE_CODEX_RUNTIME }} # zhanlu_change - gate native Bridge preparation

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GITHUB_BRANCH }}

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: https://github.com/village-way/zhanlu-code.git
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
        run: ./fetch_source.sh # zhanlu_change - build scripts live in zhanlu-code

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
        run: ./get_pr.sh

      - name: Clone VSCode repo
        run: ./get_repo.sh

      - name: Check PR or cron
        env:
          GENERATE_ASSETS: ${{ github.event.inputs.generate_assets }}
        run: ./check_cron_or_pr.sh

      - name: Check existing VSCodium tags/releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ALL: 'yes'
        run: ./check_tags.sh

  # zhanlu_change start - build each Linux Bridge on a native runner before cross-arch packaging
  prepare_responses_bridge:
    needs:
      - check
    if: (needs.check.outputs.SHOULD_BUILD == 'yes' || github.event.inputs.generate_assets == 'true') && needs.check.outputs.ZHANLU_BUNDLE_CODEX_RUNTIME == '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64
            runtime_target: linux-x64
            runner: ubuntu-24.04
          - target: arm64
            runtime_target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout zhanlu-code source
        uses: actions/checkout@v6
        with:
          repository: village-way/zhanlu-code
          ref: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          token: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
          path: zhanlu-code-source

      - name: Checkout zhanlu-core Agent source
        uses: actions/checkout@v6
        with:
          repository: village-way/zhanlu-core
          ref: ${{ env.ZHANLU_CORE_REF || 'develop' }}
          token: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
          path: zhanlu-core-bridge

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install native Bridge build dependencies
        run: sudo apt-get update -y && sudo apt-get install -y binutils file jq musl-tools

      - name: Build and verify Responses Bridge
        run: bash zhanlu-code-source/build/linux/prepare_zhanlu_responses_bridge.sh "${{ matrix.target }}" "${{ github.workspace }}/zhanlu-core-bridge/zhanlu-agent" "${{ runner.temp }}/zhanlu-responses-bridge"

      - name: Upload Responses Bridge
        uses: actions/upload-artifact@v7
        with:
          name: zhanlu-responses-bridge-${{ matrix.runtime_target }}
          path: ${{ runner.temp }}/zhanlu-responses-bridge/${{ matrix.runtime_target }}/
          retention-days: 1
  # zhanlu_change end

  compile:
    needs:
      - check
      - prepare_responses_bridge
    if: always() && needs.check.result == 'success' && (needs.prepare_responses_bridge.result == 'success' || needs.prepare_responses_bridge.result == 'skipped') # zhanlu_change - optional Bridge job may be skipped
    runs-on: ubuntu-22.04
    env:
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      SHOULD_BUILD: ${{ (needs.check.outputs.SHOULD_BUILD == 'yes' || github.event.inputs.generate_assets == 'true') && 'yes' || 'no' }}
      VSCODE_ARCH: 'x64'
    outputs:
      BUILD_SOURCEVERSION: ${{ env.BUILD_SOURCEVERSION }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GITHUB_BRANCH }}
        if: env.SHOULD_BUILD == 'yes'

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: https://github.com/village-way/zhanlu-code.git
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
        run: ./fetch_source.sh # zhanlu_change - build scripts live in zhanlu-code
        if: env.SHOULD_BUILD == 'yes'

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
        run: ./get_pr.sh

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@v2
        with:
          version: 10
          platform: x64

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
        if: env.SHOULD_BUILD == 'yes'

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
        if: env.SHOULD_BUILD == 'yes'

      - name: Install pnpm
        run: npm install -g pnpm
        if: env.SHOULD_BUILD == 'yes'

      - name: Install libkrb5-dev
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev
        if: env.SHOULD_BUILD == 'yes'

      - name: Clone VSCode repo
        run: ./get_repo.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Check PR or cron
        env:
          GENERATE_ASSETS: ${{ github.event.inputs.generate_assets }}
        run: ./check_cron_or_pr.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Write root .env for Zhanlu Agent
        env:
          ZHANLU_ROOT_DOTENV: ${{ secrets.ZHANLU_ROOT_DOTENV }}
        run: ./write_zhanlu_root_env.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Build Zhanlu Agent from zhanlu-core
        env:
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
          ZHANLU_RESPONSES_BRIDGE_BIN_ROOT: ${{ runner.temp }}/zhanlu-responses-bridge # zhanlu_change
        run: ./build_zhanlu_agent_resources.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Get Open Remote SSH / WSL builtin extensions
        run: ./get_zhanlu_remote_exts.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Build
        env:
          SHOULD_BUILD_REH: 'no'
          SHOULD_BUILD_REH_WEB: 'no'
          # zhanlu_change start - allow CI secrets to configure Zhanlu product endpoints
          ZHANLU_UPDATE_URL_LINGJI: ${{ secrets.ZHANLU_UPDATE_URL_LINGJI || secrets.ZHANLU_UPDATE_URL }}
          ZHANLU_UPDATE_URL_ECLOUD: ${{ secrets.ZHANLU_UPDATE_URL_ECLOUD || secrets.ZHANLU_UPDATE_URL }}
          ZHANLU_DOWNLOAD_URL_LINGJI: ${{ secrets.ZHANLU_DOWNLOAD_URL_LINGJI || secrets.ZHANLU_DOWNLOAD_URL }}
          ZHANLU_DOWNLOAD_URL_ECLOUD: ${{ secrets.ZHANLU_DOWNLOAD_URL_ECLOUD || secrets.ZHANLU_DOWNLOAD_URL }}
          ZHANLU_RELEASE_NOTES_URL: ${{ secrets.ZHANLU_RELEASE_NOTES_URL }}
          ZHANLU_RELEASE_NOTES_URL_LINGJI: ${{ secrets.ZHANLU_RELEASE_NOTES_URL_LINGJI || secrets.ZHANLU_RELEASE_NOTES_URL }}
          ZHANLU_RELEASE_NOTES_URL_ECLOUD: ${{ secrets.ZHANLU_RELEASE_NOTES_URL_ECLOUD || secrets.ZHANLU_RELEASE_NOTES_URL }}
          ZHANLU_CHANGELOG_API_URL_LINGJI: ${{ secrets.ZHANLU_CHANGELOG_API_URL_LINGJI || secrets.ZHANLU_CHANGELOG_API_URL }}
          ZHANLU_CHANGELOG_API_URL_ECLOUD: ${{ secrets.ZHANLU_CHANGELOG_API_URL_ECLOUD || secrets.ZHANLU_CHANGELOG_API_URL }}
          # zhanlu_change end
        run: ./build.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Compress vscode artifact
        run: |
          find vscode -type f -not -path "*/node_modules/*" -not -path "vscode/.build/node/*" -not -path "vscode/.git/*" > vscode.txt
          echo "vscode/.build/extensions/node_modules" >> vscode.txt
          echo "vscode/.git" >> vscode.txt
          tar -czf vscode.tar.gz -T vscode.txt
        if: env.SHOULD_BUILD == 'yes'

      - name: Upload vscode artifact
        uses: actions/upload-artifact@v5
        with:
          name: vscode
          path: ./vscode.tar.gz
          retention-days: ${{ needs.check.outputs.SHOULD_DEPLOY == 'yes' && 30 || 1 }}
        if: env.SHOULD_BUILD == 'yes'

  build:
    needs:
      - check
      - compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - slug: X64
          vscode_arch: x64
          npm_arch: x64
          runtime_target: linux-x64 # zhanlu_change
          image: vscodium/vscodium-linux-build-agent:focal-x64
        - slug: ARM64
          vscode_arch: arm64
          npm_arch: arm64
          runtime_target: linux-arm64 # zhanlu_change
          image: vscodium/vscodium-linux-build-agent:focal-arm64
        - slug: ARM32
          vscode_arch: armhf
          npm_arch: arm
          runtime_target: '' # zhanlu_change - Codex does not publish Linux ARM32 resources
          image: vscodium/vscodium-linux-build-agent:focal-armhf
        - slug: RISCV64
          vscode_arch: riscv64
          npm_arch: riscv64
          runtime_target: '' # zhanlu_change
          image: vscodium/vscodium-linux-build-agent:focal-riscv64
        - slug: LOONG64
          vscode_arch: loong64
          npm_arch: loong64
          runtime_target: '' # zhanlu_change
          image: vscodium/vscodium-linux-build-agent:crimson-loong64
        - slug: PPC64
          vscode_arch: ppc64le
          npm_arch: ppc64
          runtime_target: '' # zhanlu_change
          image: vscodium/vscodium-linux-build-agent:focal-ppc64le
    container:
      image: ${{ matrix.image }}
    env:
      BUILD_SOURCEVERSION: ${{ needs.compile.outputs.BUILD_SOURCEVERSION }}
      # ARM32/PPC64: the native Agent requires zl, which has no matching binary.
      # RISCV64/LOONG64: arch patches don't apply to zhanlu-core; gulp tasks missing.
      DISABLED: ${{ (matrix.slug == 'ARM32' || matrix.slug == 'PPC64' || matrix.slug == 'RISCV64' || matrix.slug == 'LOONG64') && 'yes' || vars[format('DISABLE_INSIDER_LINUX_APP_{0}', matrix.slug)] }}
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      SHOULD_BUILD: ${{ (needs.check.outputs.SHOULD_BUILD == 'yes' || github.event.inputs.generate_assets == 'true') && 'yes' || 'no' }}
      SHOULD_DEPLOY: ${{ needs.check.outputs.SHOULD_DEPLOY }}
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
    outputs:
      RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
      SHOULD_BUILD: ${{ env.SHOULD_BUILD }}
      SHOULD_DEPLOY: ${{ env.SHOULD_DEPLOY }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GITHUB_BRANCH }}
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: https://github.com/village-way/zhanlu-code.git
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
        run: ./fetch_source.sh # zhanlu_change - packaging scripts live in zhanlu-code
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
        run: ./get_pr.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Install pnpm
        run: npm install -g pnpm
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Install GH
        run: ./build/linux/install_gh.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      - name: Check existing VSCodium tags/releases
        env:
          CHECK_REH: 'no'
          DISABLE_APPIMAGE: ${{ vars.DISABLE_INSIDER_APPIMAGE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./check_tags.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Download zhanlu-core artifact for Agent build
        uses: actions/download-artifact@v8
        with:
          name: vscode
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Restore Agent source from zhanlu-core artifact
        run: ./scripts/restore-zhanlu-agent-source.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Download Responses Bridge
        uses: actions/download-artifact@v8
        with:
          name: zhanlu-responses-bridge-${{ matrix.runtime_target }}
          path: ${{ runner.temp }}/zhanlu-responses-bridge/${{ matrix.runtime_target }}
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.ZHANLU_BUNDLE_CODEX_RUNTIME == '1' && matrix.runtime_target != ''

      - name: Write root .env for target Zhanlu Agent build
        env:
          ZHANLU_ROOT_DOTENV: ${{ secrets.ZHANLU_ROOT_DOTENV }}
        run: ./write_zhanlu_root_env.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Build target Zhanlu Agent from zhanlu-core
        env:
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
          ZHANLU_RESPONSES_BRIDGE_BIN_ROOT: ${{ runner.temp }}/zhanlu-responses-bridge
        run: ./build_zhanlu_agent_resources.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'
      # zhanlu_change end

      - name: Install dependencies
        run: ./build/linux/deps.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_arch }}
        run: ./build/linux/package_bin.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Prepare assets
        env:
          SHOULD_BUILD_REH: 'no'
          SHOULD_BUILD_REH_WEB: 'no'
        run: ./prepare_assets.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && (env.SHOULD_DEPLOY == 'yes' || github.event.inputs.generate_assets == 'true')

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: ./release.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      - name: Update versions repo
        env:
          FORCE_UPDATE: ${{ github.event.inputs.force_version }}
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: ./update_version.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      - name: Upload assets
        uses: actions/upload-artifact@v5
        with:
          name: bin-${{ matrix.vscode_arch }}
          path: assets/
          retention-days: 3
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'no' && github.event.inputs.generate_assets == 'true'

  reh_linux:
    needs:
      - check
      - compile
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - slug: X64
          vscode_arch: x64
          npm_arch: x64
        - slug: ARM64
          vscode_arch: arm64
          npm_arch: arm64
        - slug: ARM32
          vscode_arch: armhf
          npm_arch: arm
        - slug: PPC64
          vscode_arch: ppc64le
          npm_arch: ppc64
        - slug: RISCV64
          vscode_arch: riscv64
          npm_arch: riscv64
        - slug: LOONG64
          vscode_arch: loong64
          npm_arch: loong64
        - slug: S390X
          vscode_arch: s390x
          npm_arch: s390x
    env:
      BUILD_SOURCEVERSION: ${{ needs.compile.outputs.BUILD_SOURCEVERSION }}
      # zhanlu_change start - skip REH arches vscode 1.126 does not ship (armhf) plus extra-arch gulp gaps
      DISABLED: ${{ (matrix.slug == 'ARM32' || matrix.slug == 'PPC64' || matrix.slug == 'RISCV64' || matrix.slug == 'LOONG64' || matrix.slug == 'S390X') && 'yes' || vars[format('DISABLE_INSIDER_LINUX_REH_{0}', matrix.slug)] }}
      # zhanlu_change end
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      SHOULD_BUILD: ${{ needs.check.outputs.SHOULD_BUILD }}
      SHOULD_DEPLOY: ${{ needs.check.outputs.SHOULD_DEPLOY }}
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
    if: needs.check.outputs.SHOULD_BUILD == 'yes' || github.event.inputs.generate_assets == 'true'

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GITHUB_BRANCH }}
        if: env.DISABLED != 'yes'

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: https://github.com/village-way/zhanlu-code.git
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
        run: ./fetch_source.sh # zhanlu_change - packaging scripts live in zhanlu-code
        if: env.DISABLED != 'yes'

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
        run: ./get_pr.sh
        if: env.DISABLED != 'yes'

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@v2
        with:
          version: 10
          platform: x64
        if: env.DISABLED != 'yes'

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
        if: env.DISABLED != 'yes'

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
        if: env.DISABLED != 'yes'

      - name: Install libkrb5-dev
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev
        if: env.DISABLED != 'yes'

      - name: Install GH
        run: ./build/linux/install_gh.sh
        if: env.DISABLED != 'yes' && env.SHOULD_DEPLOY == 'yes'

      - name: Check existing VSCodium tags/releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ONLY_REH: 'yes'
        run: ./check_tags.sh
        if: env.DISABLED != 'yes'

      # zhanlu_change start - build arch-matched zl for REH (compile artifact always embeds x64)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Download zhanlu-core artifact for Agent CLI build
        uses: actions/download-artifact@v8
        with:
          name: vscode
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Restore Agent source from zhanlu-core artifact
        run: ./scripts/restore-zhanlu-agent-source.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Write root .env for Zhanlu Agent
        env:
          ZHANLU_ROOT_DOTENV: ${{ secrets.ZHANLU_ROOT_DOTENV }}
        run: ./write_zhanlu_root_env.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Build Zhanlu Agent CLI for target arch
        env:
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
          ZHANLU_CLI_ONLY: 'yes'
        run: ./build_zhanlu_agent_resources.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')
      # zhanlu_change end


      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_arch }}
        run: ./build/linux/package_reh.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: ./release.sh
        if: env.DISABLED != 'yes' && env.SHOULD_DEPLOY == 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no')

      - name: Upload assets
        uses: actions/upload-artifact@v5
        with:
          name: reh-linux-${{ matrix.vscode_arch }}
          path: assets/
          retention-days: 3
        if: env.DISABLED != 'yes' && env.SHOULD_DEPLOY == 'no' && github.event.inputs.generate_assets == 'true'

  reh_alpine:
    needs:
      - check
      - compile
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - slug: X64
          vscode_arch: x64
          npm_arch: x64
        - slug: ARM64
          vscode_arch: arm64
          npm_arch: arm64
    env:
      BUILD_SOURCEVERSION: ${{ needs.compile.outputs.BUILD_SOURCEVERSION }}
      DISABLED: ${{ vars[format('DISABLE_INSIDER_ALPINE_REH_{0}', matrix.slug)] }}
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      OS_NAME: alpine
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      SHOULD_BUILD: ${{ needs.check.outputs.SHOULD_BUILD }}
      SHOULD_DEPLOY: ${{ needs.check.outputs.SHOULD_DEPLOY }}
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
    if: needs.check.outputs.SHOULD_BUILD == 'yes' || github.event.inputs.generate_assets == 'true'

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GITHUB_BRANCH }}

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: https://github.com/village-way/zhanlu-code.git
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
        run: ./fetch_source.sh # zhanlu_change - packaging scripts live in zhanlu-code

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
        run: ./get_pr.sh

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@v2
        with:
          version: 10
          platform: x64

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install GH
        run: ./build/linux/install_gh.sh
        if: env.SHOULD_DEPLOY == 'yes'

      - name: Check existing VSCodium tags/releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ONLY_REH: 'yes'
        run: ./check_tags.sh

      - name: Install libkrb5-dev
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev
        if: env.SHOULD_BUILD == 'yes'

      # zhanlu_change start - build arch-matched zl for REH (compile artifact always embeds x64)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Download zhanlu-core artifact for Agent CLI build
        uses: actions/download-artifact@v8
        with:
          name: vscode
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Restore Agent source from zhanlu-core artifact
        run: ./scripts/restore-zhanlu-agent-source.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Write root .env for Zhanlu Agent
        env:
          ZHANLU_ROOT_DOTENV: ${{ secrets.ZHANLU_ROOT_DOTENV }}
        run: ./write_zhanlu_root_env.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Build Zhanlu Agent CLI for target arch
        env:
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
          ZHANLU_CLI_ONLY: 'yes'
        run: ./build_zhanlu_agent_resources.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')
      # zhanlu_change end


      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_arch }}
        run: ./build/alpine/package_reh.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: ./release.sh
        if: env.DISABLED != 'yes' && env.SHOULD_DEPLOY == 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no')

      - name: Upload assets
        uses: actions/upload-artifact@v5
        with:
          name: reh-alpine-${{ matrix.vscode_arch }}
          path: assets/
          retention-days: 3
        if: env.DISABLED != 'yes' && env.SHOULD_DEPLOY == 'no' && github.event.inputs.generate_assets == 'true'

  aur:
    needs:
      - check
      - build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - package_name: zhanlu-insiders-bin # zhanlu_change - AUR publication should use Zhanlu package identity
        - package_name: zhanlu-insiders # zhanlu_change - AUR publication should use Zhanlu package identity
    if: needs.check.outputs.SHOULD_DEPLOY == 'yes' && github.event.inputs.generate_assets != 'true'

    steps:
      - name: Get version
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
        run: echo "PACKAGE_VERSION=${RELEASE_VERSION/-*/}" >> "${GITHUB_ENV}"

      - name: Publish ${{ matrix.package_name }}
        uses: zokugun/github-actions-aur-releaser@v1
        with:
          package_name: ${{ matrix.package_name }}
          package_version: ${{ env.PACKAGE_VERSION }}
          aur_private_key: ${{ secrets.AUR_PRIVATE_KEY }}
          aur_username: ${{ secrets.AUR_USERNAME }}
          aur_email: ${{ secrets.AUR_EMAIL }}

  snap:
    needs:
      - check
      - build
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      SNAP_NAME: zhanlu-insiders # zhanlu_change - Snap package keeps lowercase Zhanlu binary/package name
    strategy:
      fail-fast: false
      matrix:
        platform:
        - amd64
        - arm64
    if: needs.check.outputs.SHOULD_DEPLOY == 'yes' && needs.check.outputs.SHOULD_BUILD_SNAP != 'no' && vars.DISABLE_INSIDER_SNAP != 'yes'

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GITHUB_BRANCH }}

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: https://github.com/village-way/zhanlu-code.git
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
        run: ./fetch_source.sh # zhanlu_change - Snap packaging files live in zhanlu-code

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
        run: ./get_pr.sh

      - uses: docker/setup-qemu-action@v3

      - uses: diddlesnaps/snapcraft-multiarch-action@v1
        with:
          path: stores/snapcraft/insider
          architecture: ${{ matrix.platform }}
        id: build

      # - uses: diddlesnaps/snapcraft-review-action@v1
      #   with:
      #     snap: ${{ steps.build.outputs.snap }}
      #     isClassic: 'true'

      - uses: svenstaro/upload-release-action@v2
        with:
          repo_name: ${{ env.ASSETS_REPOSITORY }}
          repo_token: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          file: ${{ steps.build.outputs.snap }}
          tag: ${{ env.RELEASE_VERSION }}

  deploy-repo-dev:
    needs:
      - check
      - build
    runs-on: ubuntu-latest
    if: needs.check.outputs.SHOULD_DEPLOY == 'yes' && github.event.inputs.generate_assets != 'true'

    steps:
      - name: Trigger repository rebuild
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          repository: ${{ vars.LINUX_REPOSITORIES_REPO || 'village-way/zhanlu-repositories-linux' }} # zhanlu_change - avoid dispatching Zhanlu releases to VSCodium
          event-type: deploy
