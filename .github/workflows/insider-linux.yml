name: insider-linux

on:
  workflow_dispatch:
    inputs:
      force_version:
        type: boolean
        description: Force update version
      generate_assets:
        type: boolean
        description: Generate assets
      checkout_pr:
        type: string
        description: Checkout PR
  repository_dispatch:
    types: [insider]
  push:
    branches: [ insider ]
    paths-ignore:
    - '**/*.md'
    - 'upstream/*.json'
  pull_request:
    branches: [ insider ]
    paths-ignore:
    - '**/*.md'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  APP_NAME: Zhanlu # zhanlu_change - Insider keeps Zhanlu branding
  APP_IDENTIFIER: Ecloud.Zhanlu # zhanlu_change - prepare_vscode derives Ecloud.Zhanlu.Insiders
  ASSETS_REPOSITORY: ${{ github.repository }}-insiders
  BINARY_NAME: zhanlu-insiders # zhanlu_change - Insider asset/package names use the final binary name
  DISABLE_UPDATE: 'yes'
  GH_REPO_PATH: ${{ github.repository }}
  GITHUB_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }} # zhanlu_change - wrapper checkout follows the triggering ref
  ORG_NAME: Ecloud # zhanlu_change - app ids must not depend on GitHub owner
  OS_NAME: linux
  VERSIONS_REPOSITORY: ${{ github.repository_owner }}/versions
  VSCODE_QUALITY: insider
  ZHANLU_CODE_SOURCE_BRANCH: develop # zhanlu_change - wrapper workflow fetches zhanlu-code before source-owned scripts

# zhanlu_change start - the default token only reads this repository; releases use a scoped PAT
permissions:
  contents: read
# zhanlu_change end

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      MS_COMMIT: ${{ env.MS_COMMIT }}
      MS_TAG: ${{ env.MS_TAG }}
      RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
      SHOULD_BUILD: ${{ env.SHOULD_BUILD }}
      SHOULD_DEPLOY: ${{ env.SHOULD_DEPLOY }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false # zhanlu_change - no tokens in Git configuration
          ref: ${{ env.GITHUB_BRANCH }}

      # zhanlu_change start - short-lived source credentials with explicit read-only scope
      - name: Create source read token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0; Node 24
        with: &source-read-inputs
          client-id: ${{ vars.SOURCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.SOURCE_APP_REPOSITORIES || '__missing_source_repository_configuration__' }}
          permission-contents: read
      # zhanlu_change end

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: ${{ vars.SOURCE_REPO_URL }}
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }} # zhanlu_change - ephemeral read-only source credential
        run: ./fetch_source.sh # zhanlu_change - build scripts live in zhanlu-code

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # zhanlu_change - ephemeral checkout credential
        run: ./get_pr.sh

      - name: Clone VSCode repo
        env:
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }} # zhanlu_change - private fetch uses the scoped token
        run: ./get_repo.sh

      - name: Check PR or cron
        env:
          GENERATE_ASSETS: ${{ github.event.inputs.generate_assets }}
        run: ./check_cron_or_pr.sh

      - name: Check existing VSCodium tags/releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ALL: 'yes'
        run: ./check_tags.sh

  compile:
    needs:
      - check
    runs-on: ubuntu-22.04
    env:
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      SHOULD_BUILD: ${{ (needs.check.outputs.SHOULD_BUILD == 'yes' || github.event.inputs.generate_assets == 'true') && 'yes' || 'no' }}
      VSCODE_ARCH: 'x64'
    outputs:
      BUILD_SOURCEVERSION: ${{ env.BUILD_SOURCEVERSION }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false # zhanlu_change - no tokens in Git configuration
          ref: ${{ env.GITHUB_BRANCH }}
        if: env.SHOULD_BUILD == 'yes'

      # zhanlu_change start - short-lived source credentials with explicit read-only scope
      - name: Create source read token
        id: source-token
        if: env.SHOULD_BUILD == 'yes'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0; Node 24
        with: *source-read-inputs
      # zhanlu_change end

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: ${{ vars.SOURCE_REPO_URL }}
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }} # zhanlu_change - ephemeral read-only source credential
        run: ./fetch_source.sh # zhanlu_change - build scripts live in zhanlu-code
        if: env.SHOULD_BUILD == 'yes'

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # zhanlu_change - ephemeral checkout credential
        run: ./get_pr.sh

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@a2861a8b8538f49cf2850980acccf6b05a1b2ae4 # v2
        with:
          version: 10
          platform: x64

      - name: Setup Node.js environment
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
        if: env.SHOULD_BUILD == 'yes'

      - name: Setup Python 3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
        if: env.SHOULD_BUILD == 'yes'

      - name: Install libkrb5-dev
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev
        if: env.SHOULD_BUILD == 'yes'

      - name: Clone VSCode repo
        env:
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }} # zhanlu_change - private fetch uses the scoped token
        run: ./get_repo.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Check PR or cron
        env:
          GENERATE_ASSETS: ${{ github.event.inputs.generate_assets }}
        run: ./check_cron_or_pr.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Write root .env for the Agent resource build
        env:
          ZHANLU_ROOT_DOTENV: ${{ secrets.ZHANLU_ROOT_DOTENV }}
        run: ./write_zhanlu_root_env.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Build native Agent resources
        env:
          ZHANLU_SKIP_AGENT_TYPECHECK: '1' # zhanlu_change - the type check emits no packaged output
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }} # zhanlu_change - ephemeral read-only source credential
        run: ./build_zhanlu_agent_resources.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Get Open Remote SSH / WSL builtin extensions
        run: ./get_zhanlu_remote_exts.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # zhanlu_change - authenticate public dependency downloads
          SHOULD_BUILD_REH: 'no'
          SHOULD_BUILD_REH_WEB: 'no'
          # zhanlu_change start - allow CI secrets to configure Zhanlu product endpoints
          ZHANLU_UPDATE_URL_LINGJI: ${{ secrets.ZHANLU_UPDATE_URL_LINGJI || secrets.ZHANLU_UPDATE_URL }}
          ZHANLU_UPDATE_URL_ECLOUD: ${{ secrets.ZHANLU_UPDATE_URL_ECLOUD || secrets.ZHANLU_UPDATE_URL }}
          ZHANLU_DOWNLOAD_URL_LINGJI: ${{ secrets.ZHANLU_DOWNLOAD_URL_LINGJI || secrets.ZHANLU_DOWNLOAD_URL }}
          ZHANLU_DOWNLOAD_URL_ECLOUD: ${{ secrets.ZHANLU_DOWNLOAD_URL_ECLOUD || secrets.ZHANLU_DOWNLOAD_URL }}
          ZHANLU_RELEASE_NOTES_URL: ${{ secrets.ZHANLU_RELEASE_NOTES_URL }}
          ZHANLU_RELEASE_NOTES_URL_LINGJI: ${{ secrets.ZHANLU_RELEASE_NOTES_URL_LINGJI || secrets.ZHANLU_RELEASE_NOTES_URL }}
          ZHANLU_RELEASE_NOTES_URL_ECLOUD: ${{ secrets.ZHANLU_RELEASE_NOTES_URL_ECLOUD || secrets.ZHANLU_RELEASE_NOTES_URL }}
          ZHANLU_CHANGELOG_API_URL_LINGJI: ${{ secrets.ZHANLU_CHANGELOG_API_URL_LINGJI || secrets.ZHANLU_CHANGELOG_API_URL }}
          ZHANLU_CHANGELOG_API_URL_ECLOUD: ${{ secrets.ZHANLU_CHANGELOG_API_URL_ECLOUD || secrets.ZHANLU_CHANGELOG_API_URL }}
          # zhanlu_change end
        run: ./build.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Compress vscode artifact
        env:
          SOURCE_ARTIFACT_KEY: ${{ secrets.SOURCE_ARTIFACT_KEY }} # zhanlu_change
        run: |
          node scripts/source-artifact.mjs check vscode vscode-certificates.txt
          find vscode -type f -not -path "*/node_modules/*" -not -path "vscode/.build/node/*" -not -path "vscode/.git/*" > vscode.txt
          echo "vscode/.build/extensions/node_modules" >> vscode.txt
          # zhanlu_change - exclude local metadata and credentials even inside encrypted intermediates
          tar --exclude='.git' --exclude='.env' --exclude='.env.*' --exclude='.git-credentials' --exclude='*.pem' --exclude='*.key' -cf vscode.tar -T vscode.txt
          tar --null -rf vscode.tar -T vscode-certificates.txt
          gzip vscode.tar
          node scripts/source-artifact.mjs encrypt vscode.tar.gz vscode.tar.gz.enc
          rm vscode.tar.gz
        if: env.SHOULD_BUILD == 'yes'

      - name: Upload vscode artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode
          path: ./vscode.tar.gz.enc # zhanlu_change - ciphertext only
          if-no-files-found: error # zhanlu_change - never silently skip protected output
          retention-days: 1 # zhanlu_change - encrypted intermediate only
        if: env.SHOULD_BUILD == 'yes'

  build:
    needs:
      - check
      - compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - slug: X64
          vscode_arch: x64
          npm_arch: x64
          image: vscodium/vscodium-linux-build-agent:focal-x64
        - slug: ARM64
          vscode_arch: arm64
          npm_arch: arm64
          image: vscodium/vscodium-linux-build-agent:focal-arm64
    # zhanlu_change start - this fork ships only the desktop arches the native Agent supports; the
    # unsupported upstream entries are dropped instead of pulling their container image to skip.
    container:
      image: ${{ matrix.image }}
    env:
      BUILD_SOURCEVERSION: ${{ needs.compile.outputs.BUILD_SOURCEVERSION }}
      DISABLED: ${{ vars[format('DISABLE_INSIDER_LINUX_APP_{0}', matrix.slug)] }}
      # zhanlu_change end
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      SHOULD_BUILD: ${{ (needs.check.outputs.SHOULD_BUILD == 'yes' || github.event.inputs.generate_assets == 'true') && 'yes' || 'no' }}
      SHOULD_DEPLOY: ${{ needs.check.outputs.SHOULD_DEPLOY }}
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
    outputs:
      RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
      SHOULD_BUILD: ${{ env.SHOULD_BUILD }}
      SHOULD_DEPLOY: ${{ env.SHOULD_DEPLOY }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false # zhanlu_change - no tokens in Git configuration
          ref: ${{ env.GITHUB_BRANCH }}
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      # zhanlu_change start - short-lived source credentials with explicit read-only scope
      - name: Create source read token
        id: source-token
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0; Node 24
        with: *source-read-inputs
      # zhanlu_change end

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: ${{ vars.SOURCE_REPO_URL }}
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }} # zhanlu_change - ephemeral read-only source credential
        run: ./fetch_source.sh # zhanlu_change - packaging scripts live in zhanlu-code
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # zhanlu_change - ephemeral checkout credential
        run: ./get_pr.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Install GH
        run: ./build/linux/install_gh.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      - name: Check existing VSCodium tags/releases
        env:
          CHECK_REH: 'no'
          DISABLE_APPIMAGE: ${{ vars.DISABLE_INSIDER_APPIMAGE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./check_tags.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Install dependencies
        run: ./build/linux/deps.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with: # zhanlu_change - private build outputs must not enter public caches
          cache: false # zhanlu_change
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Download vscode artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vscode
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'


      - name: Authenticate and decrypt source artifact
        env:
          SOURCE_ARTIFACT_KEY: ${{ secrets.SOURCE_ARTIFACT_KEY }}
        run: node scripts/source-artifact.mjs decrypt vscode.tar.gz.enc vscode.tar.gz
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Write root .env for the Agent resource build
        env:
          ZHANLU_ROOT_DOTENV: ${{ secrets.ZHANLU_ROOT_DOTENV }}
        run: ./write_zhanlu_root_env.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      # zhanlu_change start - target packaging regenerates MXC manifests with Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Restore Agent source from the core artifact
        run: |
          ./scripts/restore-zhanlu-agent-source.sh
          # agent-web esbuild imports host modules from vscode/src; restore only unpacks zhanlu-agent.
          tar -xzf vscode.tar.gz vscode/src
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Refresh Agent resources for the target architecture
        env:
          ZHANLU_AGENT_RESOURCES_PREBUILT: 'yes'
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }} # zhanlu_change - ephemeral read-only source credential
        run: ./build_zhanlu_agent_resources.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'
      # zhanlu_change end

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_arch }}
        run: ./build/linux/package_bin.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Prepare assets
        env:
          SHOULD_BUILD_REH: 'no'
          SHOULD_BUILD_REH_WEB: 'no'
        run: ./prepare_assets.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && (env.SHOULD_DEPLOY == 'yes' || github.event.inputs.generate_assets == 'true')

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: ./release.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      - name: Update versions repo
        env:
          FORCE_UPDATE: ${{ github.event.inputs.force_version }}
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: ./update_version.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      # zhanlu_change start - protect workflow-only delivery without altering install packages
      - name: Encrypt delivery artifact
        env:
          SOURCE_ARTIFACT_KEY: ${{ secrets.SOURCE_ARTIFACT_KEY }}
        run: bash scripts/protect-delivery-artifact.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'no' && github.event.inputs.generate_assets == 'true'
      # zhanlu_change end

      - name: Upload assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bin-${{ matrix.vscode_arch }}
          path: delivery-assets.tar.enc # zhanlu_change - no plaintext delivery archives
          retention-days: 3
          if-no-files-found: error # zhanlu_change - reject missing ciphertext
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'no' && github.event.inputs.generate_assets == 'true' # zhanlu_change - release assets stay in the release only

  reh_linux:
    needs:
      - check
      - compile
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - slug: X64
          vscode_arch: x64
          npm_arch: x64
        - slug: ARM64
          vscode_arch: arm64
          npm_arch: arm64
    env:
      BUILD_SOURCEVERSION: ${{ needs.compile.outputs.BUILD_SOURCEVERSION }}
      DISABLED: ${{ vars[format('DISABLE_INSIDER_LINUX_REH_{0}', matrix.slug)] }}
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      SHOULD_BUILD: ${{ needs.check.outputs.SHOULD_BUILD }}
      SHOULD_DEPLOY: ${{ needs.check.outputs.SHOULD_DEPLOY }}
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
    if: needs.check.outputs.SHOULD_BUILD == 'yes' || github.event.inputs.generate_assets == 'true'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false # zhanlu_change - no tokens in Git configuration
          ref: ${{ env.GITHUB_BRANCH }}
        if: env.DISABLED != 'yes'

      # zhanlu_change start - short-lived source credentials with explicit read-only scope
      - name: Create source read token
        id: source-token
        if: env.DISABLED != 'yes'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0; Node 24
        with: *source-read-inputs
      # zhanlu_change end

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: ${{ vars.SOURCE_REPO_URL }}
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }} # zhanlu_change - ephemeral read-only source credential
        run: ./fetch_source.sh # zhanlu_change - packaging scripts live in zhanlu-code
        if: env.DISABLED != 'yes'

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # zhanlu_change - ephemeral checkout credential
        run: ./get_pr.sh
        if: env.DISABLED != 'yes'

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@a2861a8b8538f49cf2850980acccf6b05a1b2ae4 # v2
        with:
          version: 10
          platform: x64
        if: env.DISABLED != 'yes'

      - name: Setup Node.js environment
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
        if: env.DISABLED != 'yes'

      - name: Setup Python 3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
        if: env.DISABLED != 'yes'

      - name: Install libkrb5-dev
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev
        if: env.DISABLED != 'yes'

      - name: Install GH
        run: ./build/linux/install_gh.sh
        if: env.DISABLED != 'yes' && env.SHOULD_DEPLOY == 'yes'

      - name: Check existing VSCodium tags/releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ONLY_REH: 'yes'
        run: ./check_tags.sh
        if: env.DISABLED != 'yes'

      # zhanlu_change start - build arch-matched zl for REH (compile artifact always embeds x64)
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Write root .env for the Agent resource build
        env:
          ZHANLU_ROOT_DOTENV: ${{ secrets.ZHANLU_ROOT_DOTENV }}
        run: ./write_zhanlu_root_env.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Build the native Agent CLI for the target architecture
        env:
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }}
          ZHANLU_CLI_ONLY: 'yes'
        run: ./build_zhanlu_agent_resources.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')
      # zhanlu_change end

      - name: Download vscode artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vscode
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')


      - name: Authenticate and decrypt source artifact
        env:
          SOURCE_ARTIFACT_KEY: ${{ secrets.SOURCE_ARTIFACT_KEY }}
        run: node scripts/source-artifact.mjs decrypt vscode.tar.gz.enc vscode.tar.gz
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_arch }}
        run: ./build/linux/package_reh.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: ./release.sh
        if: env.DISABLED != 'yes' && env.SHOULD_DEPLOY == 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no')

      # zhanlu_change start - protect workflow-only delivery without altering install packages
      - name: Encrypt delivery artifact
        env:
          SOURCE_ARTIFACT_KEY: ${{ secrets.SOURCE_ARTIFACT_KEY }}
        run: bash scripts/protect-delivery-artifact.sh
        if: env.DISABLED != 'yes' && env.SHOULD_DEPLOY == 'no' && github.event.inputs.generate_assets == 'true'
      # zhanlu_change end

      - name: Upload assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reh-linux-${{ matrix.vscode_arch }}
          path: delivery-assets.tar.enc # zhanlu_change - no plaintext delivery archives
          retention-days: 3
          if-no-files-found: error # zhanlu_change - reject missing ciphertext
        if: env.DISABLED != 'yes' && env.SHOULD_DEPLOY == 'no' && github.event.inputs.generate_assets == 'true' # zhanlu_change - release assets stay in the release only

  reh_alpine:
    needs:
      - check
      - compile
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - slug: X64
          vscode_arch: x64
          npm_arch: x64
        - slug: ARM64
          vscode_arch: arm64
          npm_arch: arm64
    env:
      BUILD_SOURCEVERSION: ${{ needs.compile.outputs.BUILD_SOURCEVERSION }}
      DISABLED: ${{ vars[format('DISABLE_INSIDER_ALPINE_REH_{0}', matrix.slug)] }}
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      OS_NAME: alpine
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      SHOULD_BUILD: ${{ needs.check.outputs.SHOULD_BUILD }}
      SHOULD_DEPLOY: ${{ needs.check.outputs.SHOULD_DEPLOY }}
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
    if: needs.check.outputs.SHOULD_BUILD == 'yes' || github.event.inputs.generate_assets == 'true'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false # zhanlu_change - no tokens in Git configuration
          ref: ${{ env.GITHUB_BRANCH }}

      # zhanlu_change start - short-lived source credentials with explicit read-only scope
      - name: Create source read token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0; Node 24
        with: *source-read-inputs
      # zhanlu_change end

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: ${{ vars.SOURCE_REPO_URL }}
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }} # zhanlu_change - ephemeral read-only source credential
        run: ./fetch_source.sh # zhanlu_change - packaging scripts live in zhanlu-code

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # zhanlu_change - ephemeral checkout credential
        run: ./get_pr.sh

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@a2861a8b8538f49cf2850980acccf6b05a1b2ae4 # v2
        with:
          version: 10
          platform: x64

      - name: Setup Node.js environment
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'

      - name: Install GH
        run: ./build/linux/install_gh.sh
        if: env.SHOULD_DEPLOY == 'yes'

      - name: Check existing VSCodium tags/releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ONLY_REH: 'yes'
        run: ./check_tags.sh

      - name: Install libkrb5-dev
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev
        if: env.SHOULD_BUILD == 'yes'

      # zhanlu_change start - build arch-matched zl for REH (compile artifact always embeds x64)
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Write root .env for the Agent resource build
        env:
          ZHANLU_ROOT_DOTENV: ${{ secrets.ZHANLU_ROOT_DOTENV }}
        run: ./write_zhanlu_root_env.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Build the native Agent CLI for the target architecture
        env:
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }}
          ZHANLU_CLI_ONLY: 'yes'
        run: ./build_zhanlu_agent_resources.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')
      # zhanlu_change end

      - name: Download vscode artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vscode
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')


      - name: Authenticate and decrypt source artifact
        env:
          SOURCE_ARTIFACT_KEY: ${{ secrets.SOURCE_ARTIFACT_KEY }}
        run: node scripts/source-artifact.mjs decrypt vscode.tar.gz.enc vscode.tar.gz
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_arch }}
        run: ./build/alpine/package_reh.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: ./release.sh
        if: env.DISABLED != 'yes' && env.SHOULD_DEPLOY == 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no')

      # zhanlu_change start - protect workflow-only delivery without altering install packages
      - name: Encrypt delivery artifact
        env:
          SOURCE_ARTIFACT_KEY: ${{ secrets.SOURCE_ARTIFACT_KEY }}
        run: bash scripts/protect-delivery-artifact.sh
        if: env.DISABLED != 'yes' && env.SHOULD_DEPLOY == 'no' && github.event.inputs.generate_assets == 'true'
      # zhanlu_change end

      - name: Upload assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reh-alpine-${{ matrix.vscode_arch }}
          path: delivery-assets.tar.enc # zhanlu_change - no plaintext delivery archives
          retention-days: 3
          if-no-files-found: error # zhanlu_change - reject missing ciphertext
        if: env.DISABLED != 'yes' && env.SHOULD_DEPLOY == 'no' && github.event.inputs.generate_assets == 'true' # zhanlu_change - release assets stay in the release only

  # zhanlu_change start - upstream publishes to AUR, Snap and external Linux repositories from this
  # workflow. This fork delivers only GitHub release assets, so those jobs are not carried here.
  # zhanlu_change end
