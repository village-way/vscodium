name: insider-windows

on:
  workflow_dispatch:
    inputs:
      force_version:
        type: boolean
        description: Force update version
      generate_assets:
        type: boolean
        description: Generate assets
      checkout_pr:
        type: string
        description: Checkout PR
  repository_dispatch:
    types: [insider]
  push:
    branches: [ insider ]
    paths-ignore:
    - '**/*.md'
    - 'upstream/*.json'
  pull_request:
    branches: [ insider ]
    paths-ignore:
    - '**/*.md'

env:
  APP_NAME: Zhanlu # zhanlu_change - Insider keeps Zhanlu branding
  APP_IDENTIFIER: Ecloud.Zhanlu # zhanlu_change - prepare_vscode derives Ecloud.Zhanlu.Insiders
  ASSETS_REPOSITORY: ${{ github.repository }}-insiders
  BINARY_NAME: zhanlu-insiders # zhanlu_change - Insider asset/package names use the final binary name
  GITHUB_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }} # zhanlu_change - wrapper checkout follows the triggering ref
  GH_REPO_PATH: ${{ github.repository }}
  ORG_NAME: Ecloud # zhanlu_change - app ids must not depend on GitHub owner
  OS_NAME: windows
  VERSIONS_REPOSITORY: ${{ github.repository_owner }}/versions
  VSCODE_QUALITY: insider
  ZHANLU_CODE_SOURCE_BRANCH: develop # zhanlu_change - wrapper workflow fetches zhanlu-code before source-owned scripts

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      MS_COMMIT: ${{ env.MS_COMMIT }}
      MS_TAG: ${{ env.MS_TAG }}
      RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
      SHOULD_BUILD: ${{ env.SHOULD_BUILD }}
      SHOULD_DEPLOY: ${{ env.SHOULD_DEPLOY }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GITHUB_BRANCH }}

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: ${{ vars.SOURCE_REPO_URL }}
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
        run: ./fetch_source.sh # zhanlu_change - build scripts live in zhanlu-code

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
        run: ./get_pr.sh

      - name: Clone VSCode repo
        env:
          VSCODE_REPO: origin
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
        run: ./get_repo.sh

      - name: Check PR or cron
        env:
          GENERATE_ASSETS: ${{ github.event.inputs.generate_assets }}
        run: ./check_cron_or_pr.sh

      - name: Check existing VSCodium tags/releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ALL: 'yes'
        run: ./check_tags.sh

  compile:
    needs:
      - check
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      SHOULD_BUILD: ${{ (needs.check.outputs.SHOULD_BUILD == 'yes' || github.event.inputs.generate_assets == 'true') && 'yes' || 'no' }}
      VSCODE_ARCH: 'x64'
    outputs:
      BUILD_SOURCEVERSION: ${{ env.BUILD_SOURCEVERSION }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GITHUB_BRANCH }}
        if: env.SHOULD_BUILD == 'yes'

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: ${{ vars.SOURCE_REPO_URL }}
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
        run: ./fetch_source.sh # zhanlu_change - build scripts live in zhanlu-code
        if: env.SHOULD_BUILD == 'yes'

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
        run: ./get_pr.sh

      # - name: Setup GCC
      #   uses: egor-tensin/setup-gcc@v1
      #   with:
      #     version: 10
      #     platform: x64

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
        if: env.SHOULD_BUILD == 'yes'

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
        if: env.SHOULD_BUILD == 'yes'

      - name: Install pnpm
        run: npm install -g pnpm
        if: env.SHOULD_BUILD == 'yes'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
        if: env.SHOULD_BUILD == 'yes'

      # - name: Install libkrb5-dev
      #   run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev
      #   if: env.SHOULD_BUILD == 'yes'

      - name: Clone VSCode repo
        env:
          VSCODE_REPO: origin
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
        run: ./get_repo.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Check PR or cron
        env:
          GENERATE_ASSETS: ${{ github.event.inputs.generate_assets }}
        run: ./check_cron_or_pr.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Write root .env for the legacy extension
        env:
          ZHANLU_ROOT_DOTENV: ${{ secrets.ZHANLU_ROOT_DOTENV }}
        run: ./write_zhanlu_root_env.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Get and build the legacy extension
        env:
          ZHANLU_REPO_URL: ${{ vars.LEGACY_EXT_REPO_URL }}
          # IMPORTANT: GITHUB_TOKEN can only access the current repository.
          # For private repositories like zhanlu-vs, you need a Personal Access Token (PAT).
          # Create a PAT with 'repo' scope and store it in GitHub Secrets as ZHANLU_GITHUB_TOKEN.
          # Then update this line to: ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
        run: ./get_zhanlu.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Get Open Remote SSH / WSL builtin extensions
        run: ./get_zhanlu_remote_exts.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Build
        env:
          SHOULD_BUILD_REH: 'no'
          SHOULD_BUILD_REH_WEB: 'no'
          # zhanlu_change start - allow CI secrets to configure Zhanlu product endpoints
          ZHANLU_UPDATE_URL_LINGJI: ${{ secrets.ZHANLU_UPDATE_URL_LINGJI || secrets.ZHANLU_UPDATE_URL }}
          ZHANLU_UPDATE_URL_ECLOUD: ${{ secrets.ZHANLU_UPDATE_URL_ECLOUD || secrets.ZHANLU_UPDATE_URL }}
          ZHANLU_DOWNLOAD_URL_LINGJI: ${{ secrets.ZHANLU_DOWNLOAD_URL_LINGJI || secrets.ZHANLU_DOWNLOAD_URL }}
          ZHANLU_DOWNLOAD_URL_ECLOUD: ${{ secrets.ZHANLU_DOWNLOAD_URL_ECLOUD || secrets.ZHANLU_DOWNLOAD_URL }}
          ZHANLU_RELEASE_NOTES_URL: ${{ secrets.ZHANLU_RELEASE_NOTES_URL }}
          ZHANLU_RELEASE_NOTES_URL_LINGJI: ${{ secrets.ZHANLU_RELEASE_NOTES_URL_LINGJI || secrets.ZHANLU_RELEASE_NOTES_URL }}
          ZHANLU_RELEASE_NOTES_URL_ECLOUD: ${{ secrets.ZHANLU_RELEASE_NOTES_URL_ECLOUD || secrets.ZHANLU_RELEASE_NOTES_URL }}
          ZHANLU_CHANGELOG_API_URL_LINGJI: ${{ secrets.ZHANLU_CHANGELOG_API_URL_LINGJI || secrets.ZHANLU_CHANGELOG_API_URL }}
          ZHANLU_CHANGELOG_API_URL_ECLOUD: ${{ secrets.ZHANLU_CHANGELOG_API_URL_ECLOUD || secrets.ZHANLU_CHANGELOG_API_URL }}
          # zhanlu_change end
        run: ./build.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Compress vscode artifact
        run: |
          find vscode -type f -not -path "*/node_modules/*" -not -path "vscode/.build/node/*" -not -path "vscode/.git/*" > vscode.txt
          echo "vscode/.build/extensions/node_modules" >> vscode.txt
          echo "vscode/.git" >> vscode.txt
          tar -czf vscode.tar.gz -T vscode.txt
        if: env.SHOULD_BUILD == 'yes'

      - name: Upload vscode artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode
          path: ./vscode.tar.gz
          retention-days: ${{ needs.check.outputs.SHOULD_DEPLOY == 'yes' && 30 || 1 }}
        if: env.SHOULD_BUILD == 'yes'

  build:
    needs:
      - check
      - compile
    strategy:
      fail-fast: false
      # zhanlu_change start - ARM64 job uses windows-11-arm so get_zhanlu.sh compiles @kilocode/cli-windows-arm64 natively (x64 runner cross-compile fails on Bun toolchain extract)
      matrix:
        include:
          - vscode_arch: x64
            win_runner: windows-2022
          - vscode_arch: arm64
            win_runner: windows-11-arm
      # zhanlu_change end
    runs-on: ${{ matrix.win_runner }}
    defaults:
      run:
        shell: bash
    env:
      BUILD_SOURCEVERSION: ${{ needs.compile.outputs.BUILD_SOURCEVERSION }}
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      SHOULD_BUILD: ${{ (needs.check.outputs.SHOULD_BUILD == 'yes' || github.event.inputs.generate_assets == 'true') && 'yes' || 'no' }}
      SHOULD_DEPLOY: ${{ needs.check.outputs.SHOULD_DEPLOY }}
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
    outputs:
      RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
      SHOULD_DEPLOY: ${{ env.SHOULD_DEPLOY }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GITHUB_BRANCH }}
        if: env.SHOULD_BUILD == 'yes'

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: ${{ vars.SOURCE_REPO_URL }}
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
        run: ./fetch_source.sh # zhanlu_change - packaging scripts live in zhanlu-code
        if: env.SHOULD_BUILD == 'yes'

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
        run: ./get_pr.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
        if: env.SHOULD_BUILD == 'yes'

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
        if: env.SHOULD_BUILD == 'yes'

      - name: Install pnpm
        run: npm install -g pnpm
        if: env.SHOULD_BUILD == 'yes'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
        if: env.SHOULD_BUILD == 'yes'

      - name: Check existing VSCodium tags/releases
        env:
          DISABLE_MSI: ${{ vars.DISABLE_INSIDER_MSI }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./check_tags.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Download vscode artifact
        uses: actions/download-artifact@v8
        with:
          name: vscode
        if: env.SHOULD_BUILD == 'yes'

      - name: Write root .env for the legacy extension
        env:
          ZHANLU_ROOT_DOTENV: ${{ secrets.ZHANLU_ROOT_DOTENV }}
        run: ./write_zhanlu_root_env.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Get and build the legacy extension
        env:
          ZHANLU_REPO_URL: ${{ vars.LEGACY_EXT_REPO_URL }}
          # IMPORTANT: GITHUB_TOKEN can only access the current repository.
          # For private repositories like zhanlu-vs, you need a Personal Access Token (PAT).
          # Create a PAT with 'repo' scope and store it in GitHub Secrets as ZHANLU_GITHUB_TOKEN.
          # Then update this line to: ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
        run: ./get_zhanlu.sh
        if: env.SHOULD_BUILD == 'yes'

      # zhanlu_change start - windows-11-arm now ships VS 2026; preinstall and node-gyp 11 only accept VS 2022
      - name: Install Visual Studio 2022 C++ build tools
        if: env.SHOULD_BUILD == 'yes' && matrix.vscode_arch == 'arm64'
        shell: pwsh
        run: |
          $existing = @(
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise",
            "${env:ProgramFiles}\Microsoft Visual Studio\2022\BuildTools"
          ) | Where-Object { Test-Path $_ }
          if ($existing) {
            Write-Host "Visual Studio 2022 already present: $($existing -join ', ')"
            exit 0
          }
          $installer = Join-Path $env:TEMP "vs_buildtools.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vs_buildtools.exe" -OutFile $installer
          & $installer --wait --quiet --norestart --nocache `
            --add Microsoft.VisualStudio.Workload.VCTools `
            --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            --add Microsoft.VisualStudio.Component.VC.Runtimes.ARM64.Spectre `
            --add Microsoft.VisualStudio.Component.VC.ATL.ARM64 `
            --add Microsoft.VisualStudio.Component.VC.ATL.ARM64.Spectre `
            --add Microsoft.VisualStudio.Component.Windows11SDK.26100 `
            --includeRecommended
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
            exit $LASTEXITCODE
          }
          $installed = "${env:ProgramFiles}\Microsoft Visual Studio\2022\BuildTools"
          if (-not (Test-Path $installed)) {
            Write-Error "VS 2022 Build Tools were not installed at $installed"
            exit 1
          }
      # zhanlu_change end

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.vscode_arch }}
          npm_config_target_arch: ${{ matrix.vscode_arch }}
        run: ./build/windows/package.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Prepare assets
        run: ./prepare_assets.sh
        if: env.SHOULD_BUILD == 'yes' && (env.SHOULD_DEPLOY == 'yes' || github.event.inputs.generate_assets == 'true')

      - name: Upload unsigned artifacts
        id: upload-unsigned-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-${{ matrix.vscode_arch }}
          path: |
            assets/*.exe
            assets/*.msi
          retention-days: 1
        if: env.SHOULD_BUILD == 'yes' && vars.DISABLE_INSIDER_WINDOWS_SIGNING != 'yes' && (env.SHOULD_DEPLOY == 'yes' || github.event.inputs.generate_assets == 'true')

      - name: Signing
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifacts.outputs.artifact-id }}
          artifact-configuration-slug: ${{ matrix.vscode_arch }}
          wait-for-completion: true
          # 3h to manually approve the request
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: assets/
        if: env.SHOULD_BUILD == 'yes' && vars.DISABLE_INSIDER_WINDOWS_SIGNING != 'yes' && (env.SHOULD_DEPLOY == 'yes' || github.event.inputs.generate_assets == 'true')

      - name: Prepare checksums
        run: ./prepare_checksums.sh
        if: env.SHOULD_BUILD == 'yes' && (env.SHOULD_DEPLOY == 'yes' || github.event.inputs.generate_assets == 'true')

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: ./release.sh
        if: env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      - name: Update versions repo
        env:
          FORCE_UPDATE: ${{ github.event.inputs.force_version }}
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: ./update_version.sh
        if: env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      - name: Upload assets
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.vscode_arch }}
          path: assets/
          retention-days: 3
        if: env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'no' && github.event.inputs.generate_assets == 'true'

  winget:
    needs: build
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      APP_IDENTIFIER: Ecloud.Zhanlu.Insiders # zhanlu_change - publish Insider under its own winget id
      ASSETS_REPOSITORY: ${{ github.repository }}-insiders # zhanlu_change - use this repo's Insider release assets
    if: needs.build.outputs.SHOULD_DEPLOY == 'yes'

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GITHUB_BRANCH }}

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: ${{ vars.SOURCE_REPO_URL }}
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
        run: ./fetch_source.sh # zhanlu_change - WinGet helper scripts live in zhanlu-code

      - name: Check version
        run: ./stores/winget/check_version.sh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.RELEASE_VERSION }}

      - name: Release to WinGet
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: ${{ env.APP_IDENTIFIER }}
          version: ${{ env.RELEASE_VERSION }}
          release-repository: ${{ env.ASSETS_REPOSITORY }}
          release-tag: ${{ env.RELEASE_VERSION }}-insider
          installers-regex: '\.exe$' # only .exe files
          token: ${{ secrets.STRONGER_GITHUB_TOKEN }}
        if: env.SHOULD_DEPLOY == 'yes'
