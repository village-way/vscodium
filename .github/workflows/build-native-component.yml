name: build-native-component

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/build-native-component.yml']

permissions:
  contents: read

jobs:
  windows:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: win32-x64
            architecture: x64
          - runner: windows-11-arm
            target: win32-arm64
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      SOURCE_COMMIT: d2a8650df9469e5359f40598684a8eb5bf8447a0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.build-entry/checkout-build-inputs
        with:
          source-repository: ${{ vars.SOURCE_REPOSITORY }}
          source-ref: ${{ env.SOURCE_COMMIT }}
          app-client-id: ${{ vars.SOURCE_APP_CLIENT_ID }}
          app-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          app-owner: ${{ github.repository_owner }}
          app-repositories: ${{ vars.SOURCE_APP_REPOSITORIES }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.17'
          architecture: ${{ matrix.architecture }}
      - name: Build and verify native payload
        shell: pwsh
        env:
          COMPONENT_TARGET: ${{ matrix.target }}
          WORKFLOW_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: >-
          ./build-source/packaging/scripts/office/prepare-ocr-ci.ps1
          -Target $env:COMPONENT_TARGET -Output "$env:GITHUB_WORKSPACE/native-output"
          -Work "$env:RUNNER_TEMP/native-component" -SourceCommit $env:SOURCE_COMMIT
          -WorkflowCommit $env:WORKFLOW_COMMIT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-component-${{ matrix.target }}-${{ github.run_id }}
          path: native-output/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
