name: stable-macos

on:
  workflow_dispatch:
    inputs:
      portal_request_id:
        type: string
        description: Build Portal request id (optional)
      force_version:
        type: boolean
        description: Force update version
      generate_assets:
        type: boolean
        description: Generate assets
      checkout_pr:
        type: string
        description: Checkout PR
      source_branch:
        type: string
        description: Branch of zhanlu-code to fetch
        default: develop
      # zhanlu_change start - pin and propagate one delivery profile across every platform job
      source_ref:
        type: string
        description: Original zhanlu-code ref recorded in delivery metadata
      source_commit:
        type: string
        description: Exact zhanlu-code commit resolved during release preparation
      delivery_profile:
        type: string
        description: Delivery profile id
        default: default
      profile_digest:
        type: string
        description: SHA-256 digest of the resolved delivery profile
      assets_repository:
        type: string
        description: Allowlisted release assets repository
      # zhanlu_change end
      zhanlu_core_ref:
        type: string
        description: Branch or commit of zhanlu-core to fetch (optional)
      # zhanlu_change start - allow manually triggered releases to pin bundled zhanlu-vs source
      zhanlu_vs_ref:
        type: string
        description: Non-empty uses the legacy zhanlu-vs VSIX; empty uses the native Agent from zhanlu-core
      bundle_codex_runtime:
        type: choice
        description: Bundle the optional Codex CLI runtime
        default: '0'
        options: ['0', '1']
      # zhanlu_change end
      release_version:
        type: string
        description: Release/tag version to publish (optional)
      version_time_patch:
        type: string
        description: Internal 4-digit VS Code compatibility patch (optional)
  repository_dispatch:
    types: [stable]

run-name: stable-macos · ${{ inputs.release_version || github.event.client_payload.release_version || 'auto' }} · ${{ inputs.portal_request_id || github.event.client_payload.portal_request_id || github.run_id }}

env:
  GITHUB_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }} # zhanlu_change - wrapper checkout follows the triggering ref
  APP_NAME: Zhanlu
  APP_IDENTIFIER: Ecloud.Zhanlu # zhanlu_change - fixed package-manager identity
  ASSETS_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.assets_repository || github.event.client_payload.assets_repository || github.repository }} # zhanlu_change
  BINARY_NAME: zhanlu
  GH_REPO_PATH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.assets_repository || github.event.client_payload.assets_repository || github.repository }} # zhanlu_change
  ORG_NAME: Ecloud # zhanlu_change - app ids must not depend on GitHub owner
  OS_NAME: osx
  VERSIONS_REPOSITORY: ${{ github.repository_owner }}/versions
  VSCODE_QUALITY: stable
  ZHANLU_CODE_SOURCE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.source_ref || github.event.inputs.source_branch) || github.event.client_payload.source_ref || github.event.client_payload.source_branch || 'develop' }} # zhanlu_change
  SOURCE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_commit || github.event.client_payload.source_commit || '' }} # zhanlu_change
  ZHANLU_DELIVERY_PROFILE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.delivery_profile || github.event.client_payload.delivery_profile || 'default' }} # zhanlu_change
  ZHANLU_DELIVERY_PROFILE_DIGEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.profile_digest || github.event.client_payload.profile_digest || '' }} # zhanlu_change
  ZHANLU_CORE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.zhanlu_core_ref || github.event.client_payload.zhanlu_core_ref || '' }}
  ZHANLU_VS_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.zhanlu_vs_ref || github.event.client_payload.zhanlu_vs_ref || '' }} # zhanlu_change
  ZHANLU_BUNDLE_CODEX_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bundle_codex_runtime || github.event.client_payload.bundle_codex_runtime || '0' }} # zhanlu_change
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_version || github.event.client_payload.release_version || '' }}
  VERSION_TIME_PATCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_time_patch || github.event.client_payload.version_time_patch || '' }}
  RELEASE_VERSION_EXPLICIT: ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.release_version) || (github.event_name == 'repository_dispatch' && github.event.client_payload.release_version)) && 'yes' || 'no' }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    env:
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            vscode_arch: x64
          - runner: macos-15
            vscode_arch: arm64

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GITHUB_BRANCH }}

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: https://github.com/village-way/zhanlu-code.git
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
        run: ./fetch_source.sh

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
        run: . get_pr.sh

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Clone VSCode repo
        env:
          VSCODE_REPO: origin
          ZHANLU_CORE_REF: ${{ env.ZHANLU_CORE_REF }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
        run: . get_repo.sh

      - name: Check PR or cron
        env:
          GENERATE_ASSETS: ${{ github.event.inputs.generate_assets }}
        run: . check_cron_or_pr.sh

      - name: Write root .env for zhanlu-vs
        env:
          ZHANLU_ROOT_DOTENV: ${{ secrets.ZHANLU_ROOT_DOTENV }}
        run: ./write_zhanlu_root_env.sh
        if: env.SHOULD_BUILD == 'yes' || github.event_name == 'repository_dispatch'

      - name: Get and build zhanlu-vs
        env:
          ZHANLU_REPO_URL: https://github.com/village-way/zhanlu-vs.git
          # IMPORTANT: GITHUB_TOKEN can only access the current repository.
          # For private repositories like zhanlu-vs, you need a Personal Access Token (PAT).
          # Create a PAT with 'repo' scope and store it in GitHub Secrets as ZHANLU_GITHUB_TOKEN.
          # Then update this line to: ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
          ZHANLU_VS_REF: ${{ env.ZHANLU_VS_REF }} # zhanlu_change
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
        run: . get_zhanlu.sh
        if: env.SHOULD_BUILD == 'yes' || github.event_name == 'repository_dispatch'

      - name: Get and build zhanlu-loc (Chinese Language Pack)
        env:
          ZHANLU_LOC_REPO_URL: https://github.com/village-way/zhanlu-loc.git
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
        run: . get_zhanlu_loc.sh
        if: env.SHOULD_BUILD == 'yes' || github.event_name == 'repository_dispatch'

      - name: Get Open Remote SSH / WSL builtin extensions
        run: . get_zhanlu_remote_exts.sh
        if: env.SHOULD_BUILD == 'yes' || github.event_name == 'repository_dispatch'

      - name: Check existing VSCodium tags/releases
        env:
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }} # zhanlu_change - customer asset repositories require cross-repo access
        run: . check_tags.sh
        if: env.SHOULD_DEPLOY == 'yes'

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }} # zhanlu_change - customer asset repositories require cross-repo access
          # zhanlu_change start - allow CI secrets to configure Zhanlu product endpoints
          ZHANLU_UPDATE_URL_LINGJI: ${{ secrets.ZHANLU_UPDATE_URL_LINGJI || secrets.ZHANLU_UPDATE_URL }}
          ZHANLU_UPDATE_URL_ECLOUD: ${{ secrets.ZHANLU_UPDATE_URL_ECLOUD || secrets.ZHANLU_UPDATE_URL }}
          ZHANLU_DOWNLOAD_URL_LINGJI: ${{ secrets.ZHANLU_DOWNLOAD_URL_LINGJI || secrets.ZHANLU_DOWNLOAD_URL }}
          ZHANLU_DOWNLOAD_URL_ECLOUD: ${{ secrets.ZHANLU_DOWNLOAD_URL_ECLOUD || secrets.ZHANLU_DOWNLOAD_URL }}
          ZHANLU_RELEASE_NOTES_URL: ${{ secrets.ZHANLU_RELEASE_NOTES_URL }}
          ZHANLU_RELEASE_NOTES_URL_LINGJI: ${{ secrets.ZHANLU_RELEASE_NOTES_URL_LINGJI || secrets.ZHANLU_RELEASE_NOTES_URL }}
          ZHANLU_RELEASE_NOTES_URL_ECLOUD: ${{ secrets.ZHANLU_RELEASE_NOTES_URL_ECLOUD || secrets.ZHANLU_RELEASE_NOTES_URL }}
          ZHANLU_CHANGELOG_API_URL_LINGJI: ${{ secrets.ZHANLU_CHANGELOG_API_URL_LINGJI || secrets.ZHANLU_CHANGELOG_API_URL }}
          ZHANLU_CHANGELOG_API_URL_ECLOUD: ${{ secrets.ZHANLU_CHANGELOG_API_URL_ECLOUD || secrets.ZHANLU_CHANGELOG_API_URL }}
          # zhanlu_change end
        run: ./build.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Prepare assets
        env:
          CERTIFICATE_OSX_APP_PASSWORD: ${{ secrets.CERTIFICATE_OSX_APP_PASSWORD }}
          CERTIFICATE_OSX_ID: ${{ secrets.CERTIFICATE_OSX_ID }}
          CERTIFICATE_OSX_P12_DATA: ${{ secrets.CERTIFICATE_OSX_P12_DATA }}
          CERTIFICATE_OSX_P12_PASSWORD: ${{ secrets.CERTIFICATE_OSX_P12_PASSWORD }}
          CERTIFICATE_OSX_TEAM_ID: ${{ secrets.CERTIFICATE_OSX_TEAM_ID }}
        run: ./prepare_assets.sh
        if: env.SHOULD_BUILD == 'yes' && (env.SHOULD_DEPLOY == 'yes' || github.event.inputs.generate_assets == 'true')

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }} # zhanlu_change - customer asset repositories require cross-repo access
        run: ./release.sh
        if: env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      - name: Update versions repo
        env:
          FORCE_UPDATE: ${{ github.event.inputs.force_version }}
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: ./update_version.sh
        if: false && env.SHOULD_DEPLOY == 'yes'

      - name: Upload assets
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.vscode_arch }}
          path: assets/
          retention-days: 3
        # zhanlu_change - mirror prepare_assets: artifact on release builds too (not only --generate)
        if: env.SHOULD_BUILD == 'yes' && (env.SHOULD_DEPLOY == 'yes' || github.event.inputs.generate_assets == 'true')

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN=$RUNNER_TEMP/buildagent.keychain

          if [ -f "$KEYCHAIN" ];
          then
            security delete-keychain $KEYCHAIN
          fi
