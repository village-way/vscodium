name: stable-spearhead

on:
  workflow_dispatch:
  schedule:
    # Runs at 02:00 Beijing time (18:00 UTC).
    - cron: '0 18 * * *'

jobs:
  build:
    runs-on: macos-14
    env:
      APP_NAME: Zhanlu
      ASSETS_REPOSITORY: ${{ github.repository }}
      BINARY_NAME: zhanlu
      GH_REPO_PATH: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
      KILO_VERSION: 1.0.0
      VSCODE_QUALITY: stable

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.STRONGER_GITHUB_TOKEN }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Create release
        id: create-release
        run: |
          set -euo pipefail

          bash create-release.sh | tee create-release.log

          RELEASE_VERSION="$(sed -n 's/^RELEASE_VERSION=//p' create-release.log | tail -n 1)"
          if [[ -z "${RELEASE_VERSION}" ]]; then
            echo "Failed to capture RELEASE_VERSION from create-release.sh output"
            exit 1
          fi

          echo "release_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Trigger stable platform workflows
        run: |
          bash ./scripts/trigger-stable-release.sh \
            --workflow \
            --zhanlu-core-ref develop \
            --platform all \
            --release-version "${RELEASE_VERSION}"
        env:
          RELEASE_VERSION: ${{ steps.create-release.outputs.release_version }}
