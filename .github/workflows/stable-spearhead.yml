name: stable-spearhead

on:
  workflow_dispatch:
    inputs:
      # zhanlu_change start - scheduled/manual spearhead releases select the same delivery profile contract
      source_branch:
        type: string
        description: Branch/ref of zhanlu-code to pin
        default: develop
      delivery_profile:
        type: string
        description: Delivery profile id
        default: default
      bundle_codex_runtime:
        type: choice
        description: Bundle the Codex CLI runtime
        options:
          - '1'
          - '0'
        default: '1'
      # zhanlu_change end
  schedule:
    # Runs at 02:00 Beijing time (18:00 UTC).
    - cron: '0 18 * * *'

jobs:
  build:
    runs-on: macos-14
    env:
      APP_NAME: Zhanlu
      APP_IDENTIFIER: Ecloud.Zhanlu # zhanlu_change - fixed package-manager identity
      ASSETS_REPOSITORY: ${{ github.repository }}
      BINARY_NAME: zhanlu
      GH_REPO_PATH: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
      KILO_VERSION: 1.0.0
      ORG_NAME: Ecloud # zhanlu_change - app ids must not depend on GitHub owner
      VSCODE_QUALITY: stable
      SOURCE_BRANCH: ${{ github.event.inputs.source_branch || 'develop' }} # zhanlu_change
      ZHANLU_DELIVERY_PROFILE: ${{ github.event.inputs.delivery_profile || 'default' }} # zhanlu_change
      ZHANLU_BUNDLE_CODEX_RUNTIME: ${{ github.event.inputs.bundle_codex_runtime || '1' }} # zhanlu_change - scheduled and manual spearhead builds bundle Codex runtime by default

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.STRONGER_GITHUB_TOKEN }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Create release
        id: create-release
        env:
          # Prefer Secrets, fallback to Variables (non-sensitive is fine in vars)
          RELEASE_VERSION_BASE: ${{ secrets.RELEASE_VERSION_BASE || vars.RELEASE_VERSION_BASE }}
        run: |
          set -euo pipefail

          # If RELEASE_VERSION_BASE is set (e.g. 1.1.0), generate TIME_PATCH and
          # export RELEASE_VERSION (e.g. 1.1.0XXXX) for create-release.sh to use.
          TIME_PATCH="$(printf "%04d" "$(( $(date +%-j) * 24 + $(date +%-H) ))")"
          if [[ -n "${RELEASE_VERSION_BASE:-}" ]]; then
            export RELEASE_VERSION="${RELEASE_VERSION_BASE}${TIME_PATCH}"
          fi

          bash create-release.sh --source-branch "${SOURCE_BRANCH}" --delivery-profile "${ZHANLU_DELIVERY_PROFILE}" | tee create-release.log

          RELEASE_VERSION="$(sed -n 's/^RELEASE_VERSION=//p' create-release.log | tail -n 1)"
          if [[ -z "${RELEASE_VERSION}" ]]; then
            echo "Failed to capture RELEASE_VERSION from create-release.sh output"
            exit 1
          fi

          echo "release_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Trigger stable platform workflows
        run: |
          bash ./scripts/trigger-stable-release.sh \
            --workflow \
            --source-branch "${SOURCE_BRANCH}" \
            --delivery-profile "${ZHANLU_DELIVERY_PROFILE}" \
            --bundle-codex-runtime "${ZHANLU_BUNDLE_CODEX_RUNTIME}" \
            --platform all \
            --release-version "${RELEASE_VERSION}"
        env:
          RELEASE_VERSION: ${{ steps.create-release.outputs.release_version }}
