name: stable-spearhead

on:
  workflow_dispatch:
    inputs:
      # zhanlu_change start - allow spearhead-triggered releases to pin bundled zhanlu-vs source
      zhanlu_vs_ref:
        type: string
        description: Branch, tag, commit, or ref of zhanlu-vs to fetch (optional)
      # zhanlu_change end
  schedule:
    # Runs at 02:00 Beijing time (18:00 UTC).
    - cron: '0 18 * * *'

jobs:
  build:
    runs-on: macos-14
    env:
      APP_NAME: Zhanlu
      ASSETS_REPOSITORY: ${{ github.repository }}
      BINARY_NAME: zhanlu
      GH_REPO_PATH: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
      KILO_VERSION: 1.0.0
      VSCODE_QUALITY: stable
      ZHANLU_VS_REF: ${{ github.event.inputs.zhanlu_vs_ref || '' }} # zhanlu_change

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.STRONGER_GITHUB_TOKEN }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Create release
        id: create-release
        env:
          # Prefer Secrets, fallback to Variables (non-sensitive is fine in vars)
          RELEASE_VERSION_BASE: ${{ secrets.RELEASE_VERSION_BASE || vars.RELEASE_VERSION_BASE }}
        run: |
          set -euo pipefail

          # If RELEASE_VERSION_BASE is set (e.g. 1.1.0), generate TIME_PATCH and
          # export RELEASE_VERSION (e.g. 1.1.0XXXX) for create-release.sh to use.
          TIME_PATCH="$(printf "%04d" "$(( $(date +%-j) * 24 + $(date +%-H) ))")"
          if [[ -n "${RELEASE_VERSION_BASE:-}" ]]; then
            export RELEASE_VERSION="${RELEASE_VERSION_BASE}${TIME_PATCH}"
          fi

          bash create-release.sh | tee create-release.log

          RELEASE_VERSION="$(sed -n 's/^RELEASE_VERSION=//p' create-release.log | tail -n 1)"
          if [[ -z "${RELEASE_VERSION}" ]]; then
            echo "Failed to capture RELEASE_VERSION from create-release.sh output"
            exit 1
          fi

          echo "release_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Trigger stable platform workflows
        run: |
          # zhanlu_change start - keep spearhead-triggered platform builds on the requested zhanlu-vs ref
          zhanlu_vs_args=()
          if [[ -n "${ZHANLU_VS_REF}" ]]; then
            zhanlu_vs_args+=(--zhanlu-vs-ref "${ZHANLU_VS_REF}")
          fi
          # zhanlu_change end
          bash ./scripts/trigger-stable-release.sh \
            --workflow \
            --zhanlu-core-ref develop \
            "${zhanlu_vs_args[@]}" \
            --platform all \
            --release-version "${RELEASE_VERSION}"
        env:
          RELEASE_VERSION: ${{ steps.create-release.outputs.release_version }}
          ZHANLU_VS_REF: ${{ env.ZHANLU_VS_REF }} # zhanlu_change
