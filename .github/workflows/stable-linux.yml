  aur:
    needs:
      - check
      - build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - package_name: zhanlu # zhanlu_change - AUR publication should use Zhanlu package identity
          package_type: stable
        # - package_name: zhanlu-git # zhanlu_change
        #   package_type: rolling
    # Disabled: AUR publishing requires AUR_PRIVATE_KEY secret
    if: false && needs.check.outputs.SHOULD_DEPLOY == 'yes'

    steps:
      - name: Publish ${{ matrix.package_name }}
        uses: zokugun/github-actions-aur-releaser@v1
        with:
          package_name: ${{ matrix.package_name }}
          package_type: ${{ matrix.package_type }}
          aur_private_key: ${{ secrets.AUR_PRIVATE_KEY }}
          aur_username: ${{ secrets.AUR_USERNAME }}
          aur_email: ${{ secrets.AUR_EMAIL }}

  snap:
    needs:
      - check
      - build
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      SNAP_NAME: zhanlu # zhanlu_change - Snap package keeps lowercase Zhanlu binary/package name
    strategy:
      fail-fast: false
      matrix:
        platform:
        - amd64
        - arm64
    # Disabled: Snap store publishing requires SNAP_STORE_LOGIN and STRONGER_GITHUB_TOKEN secrets
    if: false && needs.check.outputs.SHOULD_DEPLOY == 'yes' && needs.check.outputs.SHOULD_BUILD_SNAP != 'no' && vars.DISABLE_STABLE_SNAP != 'yes'

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GITHUB_BRANCH }}

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: https://github.com/village-way/zhanlu-code.git
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.ZHANLU_GITHUB_TOKEN }}
        run: ./fetch_source.sh

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
        run: ./get_pr.sh

      - name: Check version
        env:
          ARCHITECTURE: ${{ matrix.platform }}
          GENERATE_ASSETS: ${{ github.event.inputs.generate_assets }}
          SNAPCRAFT_STORE_CHANNEL: ${{ vars.SNAP_STORE_CHANNEL }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_LOGIN }}
        run: ./stores/snapcraft/check_version.sh

      - uses: docker/setup-qemu-action@v4
        if: env.SHOULD_BUILD == 'yes'

      - uses: diddlesnaps/snapcraft-multiarch-action@v1
        with:
          path: stores/snapcraft/stable
          architecture: ${{ matrix.platform }}
        id: build
        if: env.SHOULD_BUILD == 'yes'

      - uses: diddlesnaps/snapcraft-review-action@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          isClassic: 'true'
        if: env.SHOULD_DEPLOY_TO_RELEASE == 'yes' || env.SHOULD_DEPLOY_TO_STORE == 'yes'

      - uses: svenstaro/upload-release-action@v2
        with:
          repo_name: ${{ env.ASSETS_REPOSITORY }}
          repo_token: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          file: ${{ steps.build.outputs.snap }}
          tag: ${{ env.RELEASE_VERSION }}
        if: env.SHOULD_DEPLOY_TO_RELEASE == 'yes'

      - uses: snapcore/action-publish@master
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_LOGIN }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ vars.SNAP_STORE_CHANNEL }}
        if: env.SHOULD_DEPLOY_TO_STORE == 'yes'

  deploy-repo-rudy:
    needs:
      - check
      - build
    runs-on: ubuntu-latest
    # Disabled: GitLab trigger requires GL_PAGES_TOKEN secret
    if: false && needs.check.outputs.SHOULD_DEPLOY == 'yes' && github.event.inputs.generate_assets != 'true'

    steps:
      - name: Trigger repository rebuild
        env:
          GL_PAGES_TOKEN: ${{ secrets.GL_PAGES_TOKEN }}
        run: curl -X POST --fail -F token="${GL_PAGES_TOKEN}" -F ref=master https://gitlab.com/api/v4/projects/8762263/trigger/pipeline

  deploy-repo-dev:
    needs:
      - check
      - build
    runs-on: ubuntu-latest
    # Disabled: Repository dispatch requires STRONGER_GITHUB_TOKEN secret
    if: false && needs.check.outputs.SHOULD_DEPLOY == 'yes' && github.event.inputs.generate_assets != 'true'

    steps:
      - name: Trigger repository rebuild
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          repository: ${{ vars.LINUX_REPOSITORIES_REPO || 'village-way/zhanlu-repositories-linux' }} # zhanlu_change - avoid dispatching Zhanlu releases to VSCodium
          event-type: deploy
