name: stable-linux

on:
  workflow_dispatch:
    inputs:
      portal_request_id:
        type: string
        description: Build Portal request id (optional)
      force_version:
        type: boolean
        description: Force update version
      generate_assets:
        type: boolean
        description: Generate assets
      checkout_pr:
        type: string
        description: Checkout PR
      source_branch:
        type: string
        description: Branch of zhanlu-code to fetch
        default: develop
      # zhanlu_change start - pin and propagate one delivery profile across every platform job
      source_ref:
        type: string
        description: Original zhanlu-code ref recorded in delivery metadata
      source_commit:
        type: string
        description: Exact zhanlu-code commit resolved during release preparation
      delivery_profile:
        type: string
        description: Delivery profile id
        default: default
      profile_digest:
        type: string
        description: SHA-256 digest of the resolved delivery profile
      assets_repository:
        type: string
        description: Allowlisted release assets repository
      # zhanlu_change end
      zhanlu_core_ref:
        type: string
        description: Branch or commit of zhanlu-core to fetch (optional)
      # zhanlu_change start - optional runtime bundling switch for manually triggered releases
      bundle_codex_runtime:
        type: choice
        description: Bundle the optional Codex CLI runtime
        default: '0'
        options: ['0', '1']
      # zhanlu_change end
      release_version:
        type: string
        description: Release/tag version to publish (optional)
      version_time_patch:
        type: string
        description: Internal 4-digit VS Code compatibility patch (optional)
  repository_dispatch:
    types: [stable]

run-name: stable-linux · ${{ inputs.release_version || github.event.client_payload.release_version || 'auto' }} · ${{ inputs.portal_request_id || github.event.client_payload.portal_request_id || github.run_id }}

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  GITHUB_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }} # zhanlu_change - wrapper checkout follows the triggering ref
  APP_NAME: Zhanlu
  APP_IDENTIFIER: Ecloud.Zhanlu # zhanlu_change - fixed package-manager identity
  ASSETS_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.assets_repository || github.event.client_payload.assets_repository || github.repository }} # zhanlu_change
  BINARY_NAME: zhanlu
  DISABLE_UPDATE: 'yes'
  GH_REPO_PATH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.assets_repository || github.event.client_payload.assets_repository || github.repository }} # zhanlu_change
  ZHANLU_PUBLIC_URL: https://ecloud.10086.cn/api/query/zhanlu-cloud # zhanlu_change - public product homepage for Linux metadata
  ORG_NAME: Ecloud # zhanlu_change - app ids must not depend on GitHub owner
  OS_NAME: linux
  VERSIONS_REPOSITORY: ${{ github.repository_owner }}/versions
  VSCODE_QUALITY: stable
  ZHANLU_CODE_SOURCE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.source_ref || github.event.inputs.source_branch) || github.event.client_payload.source_ref || github.event.client_payload.source_branch || 'develop' }} # zhanlu_change
  SOURCE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_commit || github.event.client_payload.source_commit || '' }} # zhanlu_change
  ZHANLU_DELIVERY_PROFILE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.delivery_profile || github.event.client_payload.delivery_profile || 'default' }} # zhanlu_change
  ZHANLU_DELIVERY_PROFILE_DIGEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.profile_digest || github.event.client_payload.profile_digest || '' }} # zhanlu_change
  ZHANLU_CORE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.zhanlu_core_ref || github.event.client_payload.zhanlu_core_ref || '' }}
  ZHANLU_BUNDLE_CODEX_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bundle_codex_runtime || github.event.client_payload.bundle_codex_runtime || '0' }} # zhanlu_change
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_version || github.event.client_payload.release_version || '' }}
  VERSION_TIME_PATCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_time_patch || github.event.client_payload.version_time_patch || '' }}
  RELEASE_VERSION_EXPLICIT: ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.release_version) || (github.event_name == 'repository_dispatch' && github.event.client_payload.release_version)) && 'yes' || 'no' }}

# zhanlu_change start - the default token only reads this repository; releases use a scoped PAT
permissions:
  contents: read
# zhanlu_change end

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      MS_COMMIT: ${{ env.MS_COMMIT }}
      MS_TAG: ${{ env.MS_TAG }}
      RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
      RELEASE_VERSION_EXPLICIT: ${{ env.RELEASE_VERSION_EXPLICIT }}
      SHOULD_BUILD: ${{ env.SHOULD_BUILD }}
      SHOULD_DEPLOY: ${{ env.SHOULD_DEPLOY }}
      VSCODE_VERSION: ${{ env.VSCODE_VERSION }} # zhanlu_change - pass internal package version to Linux asset packaging
      ZHANLU_BUNDLE_CODEX_RUNTIME: ${{ env.ZHANLU_BUNDLE_CODEX_RUNTIME }} # zhanlu_change - gate native Bridge preparation

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false # zhanlu_change - no tokens in Git configuration
          ref: ${{ env.GITHUB_BRANCH }}

      # zhanlu_change start - short-lived source credentials with explicit read-only scope
      - name: Create source read token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0; Node 24
        with: &source-read-inputs
          client-id: ${{ vars.SOURCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SOURCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.SOURCE_APP_REPOSITORIES || '__missing_source_repository_configuration__' }}
          permission-contents: read
      # zhanlu_change end

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: ${{ vars.SOURCE_REPO_URL }}
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }} # zhanlu_change - ephemeral read-only source credential
        run: ./fetch_source.sh

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # zhanlu_change - ephemeral checkout credential
        run: ./get_pr.sh

      - name: Clone VSCode repo
        env:
          VSCODE_REPO: origin
          ZHANLU_CORE_REF: ${{ env.ZHANLU_CORE_REF }}
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }} # zhanlu_change - ephemeral read-only source credential
        run: ./get_repo.sh

      - name: Check PR or cron
        env:
          GENERATE_ASSETS: ${{ github.event.inputs.generate_assets }}
        run: ./check_cron_or_pr.sh

      - name: Check existing VSCodium tags/releases
        env:
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }} # zhanlu_change - customer asset repositories require cross-repo access
          CHECK_ALL: 'yes'
        run: ./check_tags.sh

  # zhanlu_change start - build each Linux Bridge on a native runner before cross-arch packaging
  prepare_responses_bridge:
    needs:
      - check
    if: (needs.check.outputs.SHOULD_BUILD == 'yes' || github.event.inputs.generate_assets == 'true') && needs.check.outputs.ZHANLU_BUNDLE_CODEX_RUNTIME == '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64
            runtime_target: linux-x64
            runner: ubuntu-24.04
          - target: arm64
            runtime_target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Create source read token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0; Node 24
        with: *source-read-inputs

      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false # zhanlu_change - no tokens in Git configuration
          repository: ${{ vars.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_COMMIT || env.ZHANLU_CODE_SOURCE_BRANCH }}
          token: ${{ steps.source-token.outputs.token }}
          path: zhanlu-code-source

      - name: Checkout the Responses Bridge source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false # zhanlu_change - no tokens in Git configuration
          repository: ${{ vars.RESPONSES_BRIDGE_REPOSITORY }}
          ref: develop
          token: ${{ steps.source-token.outputs.token }}
          path: responses-bridge-source

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with: # zhanlu_change - private build outputs must not enter public caches
          cache: false # zhanlu_change

      - name: Install native Bridge build dependencies
        run: sudo apt-get update -y && sudo apt-get install -y binutils file jq musl-tools

      - name: Verify native runner architecture
        run: |
          uname -m
          rustc -vV

      - name: Build and verify Responses Bridge
        run: |
          bash zhanlu-code-source/build/linux/prepare_zhanlu_responses_bridge.sh \
            "${{ matrix.target }}" \
            "${{ github.workspace }}/responses-bridge-source" \
            "${{ runner.temp }}/zhanlu-responses-bridge"

      - name: Upload Responses Bridge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zhanlu-responses-bridge-${{ matrix.runtime_target }}
          path: ${{ runner.temp }}/zhanlu-responses-bridge/${{ matrix.runtime_target }}/
          retention-days: 1
  # zhanlu_change end

  compile:
    needs:
      - check
      - prepare_responses_bridge
    if: always() && needs.check.result == 'success' && (needs.prepare_responses_bridge.result == 'success' || needs.prepare_responses_bridge.result == 'skipped') # zhanlu_change - optional Bridge job may be skipped
    runs-on: ubuntu-22.04
    env:
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      RELEASE_VERSION_EXPLICIT: ${{ needs.check.outputs.RELEASE_VERSION_EXPLICIT }}
      SHOULD_BUILD: ${{ (needs.check.outputs.SHOULD_BUILD == 'yes' || github.event.inputs.generate_assets == 'true') && 'yes' || 'no' }}
      VSCODE_VERSION: ${{ needs.check.outputs.VSCODE_VERSION }} # zhanlu_change - keep public release version separate from package version
      VSCODE_ARCH: 'x64'
    outputs:
      BUILD_SOURCEVERSION: ${{ env.BUILD_SOURCEVERSION }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false # zhanlu_change - no tokens in Git configuration
          ref: ${{ env.GITHUB_BRANCH }}
        if: env.SHOULD_BUILD == 'yes'

      # zhanlu_change start - short-lived source credentials with explicit read-only scope
      - name: Create source read token
        id: source-token
        if: env.SHOULD_BUILD == 'yes' || github.event_name == 'repository_dispatch'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0; Node 24
        with: *source-read-inputs
      # zhanlu_change end

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: ${{ vars.SOURCE_REPO_URL }}
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }} # zhanlu_change - ephemeral read-only source credential
        run: ./fetch_source.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # zhanlu_change - ephemeral checkout credential
        run: ./get_pr.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@a2861a8b8538f49cf2850980acccf6b05a1b2ae4 # v2
        with:
          version: 10
          platform: x64
        if: env.SHOULD_BUILD == 'yes'

      - name: Setup Node.js environment
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
        if: env.SHOULD_BUILD == 'yes'

      - name: Setup Python 3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
        if: env.SHOULD_BUILD == 'yes'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
        if: env.SHOULD_BUILD == 'yes' || github.event_name == 'repository_dispatch'

      - name: Install libkrb5-dev
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev
        if: env.SHOULD_BUILD == 'yes'

      - name: Clone VSCode repo
        env:
          VSCODE_REPO: origin
          ZHANLU_CORE_REF: ${{ env.ZHANLU_CORE_REF }}
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }} # zhanlu_change - ephemeral read-only source credential
        run: ./get_repo.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Check PR or cron
        env:
          GENERATE_ASSETS: ${{ github.event.inputs.generate_assets }}
        run: ./check_cron_or_pr.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Write root .env for the Agent resource build
        env:
          ZHANLU_ROOT_DOTENV: ${{ secrets.ZHANLU_ROOT_DOTENV }}
        run: ./write_zhanlu_root_env.sh
        if: env.SHOULD_BUILD == 'yes' || github.event_name == 'repository_dispatch'

      # zhanlu_change start - consume the native x64 Bridge instead of compiling in the desktop job
      - name: Download Responses Bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: zhanlu-responses-bridge-linux-x64
          path: zhanlu-responses-bridge/linux-x64
        if: env.ZHANLU_BUNDLE_CODEX_RUNTIME == '1' && (env.SHOULD_BUILD == 'yes' || github.event_name == 'repository_dispatch')
      - name: Restore Responses Bridge executable permission
        run: |
          bridge="$GITHUB_WORKSPACE/zhanlu-responses-bridge/linux-x64/zhanlu-responses-bridge"
          chmod 755 "$bridge"
          test -x "$bridge"
          echo "ZHANLU_RESPONSES_BRIDGE_BIN_ROOT=$GITHUB_WORKSPACE/zhanlu-responses-bridge" >> "$GITHUB_ENV"
        if: env.ZHANLU_BUNDLE_CODEX_RUNTIME == '1' && (env.SHOULD_BUILD == 'yes' || github.event_name == 'repository_dispatch')
      # zhanlu_change end

      - name: Build native Agent resources
        env:
          ZHANLU_SKIP_AGENT_TYPECHECK: '1' # zhanlu_change - the type check emits no packaged output
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }} # zhanlu_change - ephemeral read-only source credential
        run: ./build_zhanlu_agent_resources.sh
        if: env.SHOULD_BUILD == 'yes' || github.event_name == 'repository_dispatch'

      - name: Get Open Remote SSH / WSL builtin extensions
        run: ./get_zhanlu_remote_exts.sh
        if: env.SHOULD_BUILD == 'yes' || github.event_name == 'repository_dispatch'

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # zhanlu_change - authenticate public dependency downloads
          SHOULD_BUILD_REH: 'no'
          SHOULD_BUILD_REH_WEB: 'no'
          # zhanlu_change start - allow CI secrets to configure Zhanlu product endpoints
          ZHANLU_UPDATE_URL_LINGJI: ${{ secrets.ZHANLU_UPDATE_URL_LINGJI || secrets.ZHANLU_UPDATE_URL }}
          ZHANLU_UPDATE_URL_ECLOUD: ${{ secrets.ZHANLU_UPDATE_URL_ECLOUD || secrets.ZHANLU_UPDATE_URL }}
          ZHANLU_DOWNLOAD_URL_LINGJI: ${{ secrets.ZHANLU_DOWNLOAD_URL_LINGJI || secrets.ZHANLU_DOWNLOAD_URL }}
          ZHANLU_DOWNLOAD_URL_ECLOUD: ${{ secrets.ZHANLU_DOWNLOAD_URL_ECLOUD || secrets.ZHANLU_DOWNLOAD_URL }}
          ZHANLU_RELEASE_NOTES_URL: ${{ secrets.ZHANLU_RELEASE_NOTES_URL }}
          ZHANLU_RELEASE_NOTES_URL_LINGJI: ${{ secrets.ZHANLU_RELEASE_NOTES_URL_LINGJI || secrets.ZHANLU_RELEASE_NOTES_URL }}
          ZHANLU_RELEASE_NOTES_URL_ECLOUD: ${{ secrets.ZHANLU_RELEASE_NOTES_URL_ECLOUD || secrets.ZHANLU_RELEASE_NOTES_URL }}
          ZHANLU_CHANGELOG_API_URL_LINGJI: ${{ secrets.ZHANLU_CHANGELOG_API_URL_LINGJI || secrets.ZHANLU_CHANGELOG_API_URL }}
          ZHANLU_CHANGELOG_API_URL_ECLOUD: ${{ secrets.ZHANLU_CHANGELOG_API_URL_ECLOUD || secrets.ZHANLU_CHANGELOG_API_URL }}
          # zhanlu_change end
        run: ./build.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Compress vscode artifact
        env:
          SOURCE_ARTIFACT_KEY: ${{ secrets.SOURCE_ARTIFACT_KEY }} # zhanlu_change
        run: |
          node scripts/source-artifact.mjs check vscode vscode-certificates.txt
          find vscode -type f -not -path "*/node_modules/*" -not -path "vscode/.build/node/*" -not -path "vscode/.git/*" > vscode.txt
          echo "vscode/.build/extensions/node_modules" >> vscode.txt
          # zhanlu_change - exclude local metadata and credentials even inside encrypted intermediates
          tar --exclude='.git' --exclude='.env' --exclude='.env.*' --exclude='.git-credentials' --exclude='*.pem' --exclude='*.key' -cf vscode.tar -T vscode.txt
          tar --null -rf vscode.tar -T vscode-certificates.txt
          gzip vscode.tar
          node scripts/source-artifact.mjs encrypt vscode.tar.gz vscode.tar.gz.enc
          rm vscode.tar.gz
        if: env.SHOULD_BUILD == 'yes'

      - name: Upload vscode artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vscode
          path: ./vscode.tar.gz.enc # zhanlu_change - ciphertext only
          if-no-files-found: error # zhanlu_change - never silently skip protected output
          retention-days: 1 # zhanlu_change - encrypted intermediate only
        if: env.SHOULD_BUILD == 'yes'

  build:
    needs:
      - check
      - compile
    # zhanlu_change - do not inherit a skipped optional Bridge need through compile
    if: always() && needs.check.result == 'success' && needs.compile.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - slug: X64
          vscode_arch: x64
          npm_arch: x64
          runtime_target: linux-x64 # zhanlu_change
          image: vscodium/vscodium-linux-build-agent:focal-x64
        - slug: ARM64
          vscode_arch: arm64
          npm_arch: arm64
          runtime_target: linux-arm64 # zhanlu_change
          image: vscodium/vscodium-linux-build-agent:focal-arm64
    # zhanlu_change start - this fork ships only the desktop arches the native Agent supports, so the
    # unsupported upstream entries are dropped instead of pulling their container image to skip:
    # ARM32 has no zl binary, PPC64 has no matching Electron build, and RISCV64/LOONG64 depend on
    # arch patches that do not apply to the core source. Re-add the upstream entry to restore one.
    container:
      image: ${{ matrix.image }}
    env:
      BUILD_SOURCEVERSION: ${{ needs.compile.outputs.BUILD_SOURCEVERSION }}
      DISABLED: ${{ vars[format('DISABLE_STABLE_LINUX_APP_{0}', matrix.slug)] }}
      # zhanlu_change end
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      RELEASE_VERSION_EXPLICIT: ${{ needs.check.outputs.RELEASE_VERSION_EXPLICIT }}
      SHOULD_BUILD: ${{ (needs.check.outputs.SHOULD_BUILD == 'yes' || github.event.inputs.generate_assets == 'true') && 'yes' || 'no' }}
      SHOULD_DEPLOY: ${{ needs.check.outputs.SHOULD_DEPLOY }}
      VSCODE_VERSION: ${{ needs.check.outputs.VSCODE_VERSION }} # zhanlu_change - prepare_assets needs the generated native package version
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
    outputs:
      RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
      SHOULD_BUILD: ${{ env.SHOULD_BUILD }}
      SHOULD_DEPLOY: ${{ env.SHOULD_DEPLOY }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false # zhanlu_change - no tokens in Git configuration
          ref: ${{ env.GITHUB_BRANCH }}
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      # zhanlu_change start - short-lived source credentials with explicit read-only scope
      - name: Create source read token
        id: source-token
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD == 'yes' || github.event_name == 'repository_dispatch')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0; Node 24
        with: *source-read-inputs
      # zhanlu_change end

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: ${{ vars.SOURCE_REPO_URL }}
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }} # zhanlu_change - ephemeral read-only source credential
        run: ./fetch_source.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      # zhanlu_change start - always restore the compiled Core artifact; native Agent additionally restores its source
      - name: Download vscode artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vscode
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'


      - name: Authenticate and decrypt source artifact
        env:
          SOURCE_ARTIFACT_KEY: ${{ secrets.SOURCE_ARTIFACT_KEY }}
        run: node scripts/source-artifact.mjs decrypt vscode.tar.gz.enc vscode.tar.gz
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Restore Agent source from the core artifact
        run: |
          ./scripts/restore-zhanlu-agent-source.sh
          # agent-web esbuild imports host modules from vscode/src; restore only unpacks zhanlu-agent.
          tar -xzf vscode.tar.gz vscode/src
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'
      # zhanlu_change end

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # zhanlu_change - ephemeral checkout credential
        run: ./get_pr.sh
        if: env.DISABLED != 'yes'

      - name: Install GH
        run: ./build/linux/install_gh.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      - name: Check existing VSCodium tags/releases
        env:
          CHECK_REH: 'no'
          DISABLE_APPIMAGE: ${{ vars.DISABLE_STABLE_APPIMAGE }}
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }} # zhanlu_change - customer asset repositories require cross-repo access
        run: ./check_tags.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Write root .env for the Agent resource build
        env:
          ZHANLU_ROOT_DOTENV: ${{ secrets.ZHANLU_ROOT_DOTENV }}
        run: ./write_zhanlu_root_env.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD == 'yes' || github.event_name == 'repository_dispatch')

      # zhanlu_change start - target packaging regenerates MXC manifests with Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'
      # zhanlu_change end

      # zhanlu_change start - consume the native target Bridge before building the target VSIX
      - name: Download Responses Bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: zhanlu-responses-bridge-${{ matrix.runtime_target }}
          path: zhanlu-responses-bridge/${{ matrix.runtime_target }}
        if: env.DISABLED != 'yes' && env.ZHANLU_BUNDLE_CODEX_RUNTIME == '1' && matrix.runtime_target != '' && (env.SHOULD_BUILD == 'yes' || github.event_name == 'repository_dispatch')
      - name: Restore Responses Bridge executable permission
        run: |
          bridge="$GITHUB_WORKSPACE/zhanlu-responses-bridge/${{ matrix.runtime_target }}/zhanlu-responses-bridge"
          chmod 755 "$bridge"
          test -x "$bridge"
          echo "ZHANLU_RESPONSES_BRIDGE_BIN_ROOT=$GITHUB_WORKSPACE/zhanlu-responses-bridge" >> "$GITHUB_ENV"
        if: env.DISABLED != 'yes' && env.ZHANLU_BUNDLE_CODEX_RUNTIME == '1' && matrix.runtime_target != '' && (env.SHOULD_BUILD == 'yes' || github.event_name == 'repository_dispatch')
      # zhanlu_change end

      - name: Refresh Agent resources for the target architecture
        env:
          ZHANLU_AGENT_RESOURCES_PREBUILT: 'yes' # zhanlu_change - the restored compile artifact already holds the arch-independent bundles
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }} # zhanlu_change - ephemeral read-only source credential
        run: ./build_zhanlu_agent_resources.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD == 'yes' || github.event_name == 'repository_dispatch')

      - name: Install dependencies
        run: ./build/linux/deps.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with: # zhanlu_change - private build outputs must not enter public caches
          cache: false # zhanlu_change
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }} # zhanlu_change - customer asset repositories require cross-repo access
          npm_config_arch: ${{ matrix.npm_arch }}
        run: ./build/linux/package_bin.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Prepare assets
        env:
          SHOULD_BUILD_REH: 'no'
          SHOULD_BUILD_REH_WEB: 'no'
        run: ./prepare_assets.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && (env.SHOULD_DEPLOY == 'yes' || github.event.inputs.generate_assets == 'true')

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: ./release.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      # zhanlu_change start - protect workflow-only delivery without altering install packages
      - name: Encrypt delivery artifact
        env:
          SOURCE_ARTIFACT_KEY: ${{ secrets.SOURCE_ARTIFACT_KEY }}
        run: bash scripts/protect-delivery-artifact.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'no' && github.event.inputs.generate_assets == 'true'
      # zhanlu_change end

      - name: Upload assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bin-${{ matrix.vscode_arch }}
          path: delivery-assets.tar.enc # zhanlu_change - no plaintext delivery archives
          retention-days: 3
          if-no-files-found: error # zhanlu_change - reject missing ciphertext
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'no' && github.event.inputs.generate_assets == 'true' # zhanlu_change - release assets stay in the release only

  # zhanlu_change start - publish extra standalone CLI variants from opencode's full cross-platform build
  zhanlu_cli_compat:
    needs:
      - check
    runs-on: ubuntu-22.04
    env:
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      RELEASE_VERSION_EXPLICIT: ${{ needs.check.outputs.RELEASE_VERSION_EXPLICIT }}
      SHOULD_BUILD: ${{ (needs.check.outputs.SHOULD_BUILD == 'yes' || github.event.inputs.generate_assets == 'true') && 'yes' || 'no' }}
      SHOULD_DEPLOY: ${{ needs.check.outputs.SHOULD_DEPLOY }}
    if: needs.check.outputs.SHOULD_BUILD == 'yes' || github.event.inputs.generate_assets == 'true'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false # zhanlu_change - no tokens in Git configuration
          ref: ${{ env.GITHUB_BRANCH }}
        if: env.SHOULD_BUILD == 'yes'

      - name: Create source read token
        id: source-token
        if: env.SHOULD_BUILD == 'yes'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0; Node 24
        with: *source-read-inputs

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: ${{ vars.SOURCE_REPO_URL }}
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }}
        run: ./fetch_source.sh
        if: env.SHOULD_BUILD == 'yes'

      # CLI compatibility assets now consume the Agent workspace from zhanlu-core
      - name: Clone VSCode repo
        env:
          VSCODE_REPO: origin
          ZHANLU_CORE_REF: ${{ env.ZHANLU_CORE_REF }}
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }}
        run: ./get_repo.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Setup Node.js environment
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
        if: env.SHOULD_BUILD == 'yes'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
        if: env.SHOULD_BUILD == 'yes'

      - name: Install zip
        run: sudo apt-get update -y && sudo apt-get install -y zip
        if: env.SHOULD_BUILD == 'yes'

      - name: Prepare CLI compatibility assets
        env:
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }}
        run: bash ./prepare_zhanlu_cli_assets.sh
        if: env.SHOULD_BUILD == 'yes'

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: ./release.sh
        if: env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      - name: Encrypt delivery artifact
        env:
          SOURCE_ARTIFACT_KEY: ${{ secrets.SOURCE_ARTIFACT_KEY }}
        run: bash scripts/protect-delivery-artifact.sh
        if: env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'no' && github.event.inputs.generate_assets == 'true'

      - name: Upload assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zhanlu-cli-compat
          path: delivery-assets.tar.enc # zhanlu_change - no plaintext delivery archives
          retention-days: 3
          if-no-files-found: error # zhanlu_change - reject missing ciphertext
        if: env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'no' && github.event.inputs.generate_assets == 'true' # zhanlu_change - release assets stay in the release only
  # zhanlu_change end

  reh_linux:
    needs:
      - check
      - compile
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - slug: X64
          vscode_arch: x64
          npm_arch: x64
        - slug: ARM64
          vscode_arch: arm64
          npm_arch: arm64
    env:
      BUILD_SOURCEVERSION: ${{ needs.compile.outputs.BUILD_SOURCEVERSION }}
      # zhanlu_change start - the upstream REH arches vscode 1.126 no longer ships (linux-armhf) and
      # the extra arches whose gulp tasks require arch-1..4 patches (PPC64/RISCV64/LOONG64/S390X)
      # are dropped from the matrix instead of started and skipped.
      DISABLED: ${{ vars[format('DISABLE_STABLE_LINUX_REH_{0}', matrix.slug)] }}
      # zhanlu_change end
      MS_COMMIT: ${{ needs.check.outputs.MS_COMMIT }}
      MS_TAG: ${{ needs.check.outputs.MS_TAG }}
      RELEASE_VERSION: ${{ needs.check.outputs.RELEASE_VERSION }}
      RELEASE_VERSION_EXPLICIT: ${{ needs.check.outputs.RELEASE_VERSION_EXPLICIT }}
      SHOULD_BUILD: ${{ needs.check.outputs.SHOULD_BUILD }}
      SHOULD_DEPLOY: ${{ needs.check.outputs.SHOULD_DEPLOY }}
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
    # zhanlu_change - do not inherit a skipped optional Bridge need through compile
    if: always() && needs.check.result == 'success' && needs.compile.result == 'success' && (needs.check.outputs.SHOULD_BUILD == 'yes' || github.event.inputs.generate_assets == 'true')

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false # zhanlu_change - no tokens in Git configuration
          ref: ${{ env.GITHUB_BRANCH }}
        if: env.DISABLED != 'yes'

      # zhanlu_change start - short-lived source credentials with explicit read-only scope
      - name: Create source read token
        id: source-token
        if: env.DISABLED != 'yes'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0; Node 24
        with: *source-read-inputs
      # zhanlu_change end

      - name: Fetch source code from private repository
        env:
          SOURCE_REPO_URL: ${{ vars.SOURCE_REPO_URL }}
          SOURCE_BRANCH: ${{ env.ZHANLU_CODE_SOURCE_BRANCH }}
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }} # zhanlu_change - ephemeral read-only source credential
        run: ./fetch_source.sh
        if: env.DISABLED != 'yes'

      - name: Switch to relevant branch
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
          ZHANLU_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # zhanlu_change - ephemeral checkout credential
        run: ./get_pr.sh
        if: env.DISABLED != 'yes'

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@a2861a8b8538f49cf2850980acccf6b05a1b2ae4 # v2
        with:
          version: 10
          platform: x64
        if: env.DISABLED != 'yes'

      - name: Setup Node.js environment
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
        if: env.DISABLED != 'yes'

      - name: Setup Python 3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
        if: env.DISABLED != 'yes'

      - name: Install libkrb5-dev
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev
        if: env.DISABLED != 'yes'

      - name: Install GH
        run: ./build/linux/install_gh.sh
        if: env.DISABLED != 'yes' && env.SHOULD_DEPLOY == 'yes'

      - name: Check existing VSCodium tags/releases
        env:
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }} # zhanlu_change - customer asset repositories require cross-repo access
          CHECK_ONLY_REH: 'yes'
        run: ./check_tags.sh
        if: env.DISABLED != 'yes'

      # zhanlu_change start - build arch-matched zl for REH (compile artifact always embeds x64)
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      # Always restore the compiled Core artifact; native Agent additionally restores its source.
      - name: Download vscode artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vscode
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')


      - name: Authenticate and decrypt source artifact
        env:
          SOURCE_ARTIFACT_KEY: ${{ secrets.SOURCE_ARTIFACT_KEY }}
        run: node scripts/source-artifact.mjs decrypt vscode.tar.gz.enc vscode.tar.gz
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Restore Agent source from the core artifact
        run: ./scripts/restore-zhanlu-agent-source.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')
      - name: Write root .env for the Agent resource build
        env:
          ZHANLU_ROOT_DOTENV: ${{ secrets.ZHANLU_ROOT_DOTENV }}
        run: ./write_zhanlu_root_env.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Build the native Agent CLI for the target architecture
        env:
          ZHANLU_GITHUB_TOKEN: ${{ steps.source-token.outputs.token }}
          ZHANLU_CLI_ONLY: 'yes'
        run: ./build_zhanlu_agent_resources.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')
      # zhanlu_change end

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }} # zhanlu_change - customer asset repositories require cross-repo access
          npm_config_arch: ${{ matrix.npm_arch }}
        run: ./build/linux/package_reh.sh
        if: env.DISABLED != 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no' || github.event.inputs.generate_assets == 'true')

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: ./release.sh
        if: env.DISABLED != 'yes' && env.SHOULD_DEPLOY == 'yes' && (env.SHOULD_BUILD_REH != 'no' || env.SHOULD_BUILD_REH_WEB != 'no')

      # zhanlu_change start - protect workflow-only delivery without altering install packages
      - name: Encrypt delivery artifact
        env:
          SOURCE_ARTIFACT_KEY: ${{ secrets.SOURCE_ARTIFACT_KEY }}
        run: bash scripts/protect-delivery-artifact.sh
        if: env.DISABLED != 'yes' && env.SHOULD_DEPLOY == 'no' && github.event.inputs.generate_assets == 'true'
      # zhanlu_change end

      - name: Upload assets
