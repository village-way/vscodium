name: build-portal-ci

on:
  pull_request:
    paths: ["build-portal/**", ".agents/skills/zhanlu-build/**", "scripts/trigger-stable-release.sh", ".github/workflows/stable-*.yml", ".github/workflows/build-portal-ci.yml"]
  push:
    branches: [master]
    paths: ["build-portal/**", ".agents/skills/zhanlu-build/**", "scripts/trigger-stable-release.sh", ".github/workflows/stable-*.yml", ".github/workflows/build-portal-ci.yml"]

permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: build-portal } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: pnpm, cache-dependency-path: build-portal/pnpm-lock.yaml }
      - run: corepack enable && corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Validate release wrapper compatibility
        working-directory: .
        run: python3 .agents/skills/zhanlu-build/scripts/test_zhanlu_build.py
      - name: Render Kubernetes manifests
        run: kubectl kustomize deploy/k8s/base > /tmp/build-portal.yaml

  images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: build-portal, file: build-portal/deploy/docker/Dockerfile.web, push: false, tags: zhanlu/build-portal-web:test }
      - uses: docker/build-push-action@v6
        with: { context: build-portal, file: build-portal/deploy/docker/Dockerfile.worker, push: false, tags: zhanlu/build-portal-worker:test }
