# zhanlu_change - new file
# Verify source confidentiality and ephemeral authentication without production secrets.

name: build-security
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test scripts/tests/build-security.test.mjs
        shell: bash
